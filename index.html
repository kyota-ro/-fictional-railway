<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>架空鉄道 発車標</title>
<style>
:root{--bg:#050607;--line:#2b3035;--text:#f7f8fa;--muted:#a9b0b7;--yellow:#ffd43b;--green:#087b55;--red:#b83232;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:#050607;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.board{min-height:100svh;background:var(--bg);padding-bottom:44px}.top{display:flex;justify-content:space-between;align-items:end;padding:calc(16px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}.brand{font-size:12px;color:var(--muted)}.station{font-size:clamp(30px,8vw,48px);font-weight:850}.clock{font-size:clamp(20px,5vw,32px);font-variant-numeric:tabular-nums}.head,.row{display:grid;grid-template-columns:1.05fr 1.05fr 2.25fr .55fr;align-items:center}.head{padding:10px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.row{padding:12px 14px;min-height:104px;border-bottom:1px solid var(--line)}.time{font-size:clamp(31px,8vw,50px);font-weight:750;font-variant-numeric:tabular-nums}.badge{display:inline-block;max-width:100%;padding:6px 8px;border-radius:7px;background:var(--green);font-size:clamp(13px,3.6vw,20px);font-weight:800;text-align:center;white-space:nowrap}.dest{font-size:clamp(25px,6.5vw,42px);font-weight:850;line-height:1.05;overflow-wrap:anywhere}.dest small{display:block;margin-top:7px;color:#bcc2c8;font-size:.45em;line-height:1.1}.track{text-align:center;color:var(--yellow);font-size:clamp(32px,8vw,50px);font-weight:850}.status{font-size:11px;color:var(--yellow);margin-top:7px}.ticker{position:fixed;left:0;right:0;bottom:0;height:44px;background:#090b0d;border-top:1px solid var(--line);overflow:hidden;white-space:nowrap;color:var(--yellow);font-size:17px;line-height:44px}.ticker span{display:inline-block;padding-left:100%;animation:marquee 20s linear infinite}@keyframes marquee{to{transform:translateX(-100%)}}.gear{position:fixed;right:14px;bottom:58px;width:48px;height:48px;border:1px solid #4b5157;border-radius:50%;background:#161a1e;color:#fff;font-size:23px;z-index:5}.settings{display:none;position:fixed;inset:0;z-index:10;background:#f5f6f8;color:#17202a;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}.settings.open{display:block}.settings h2{margin:0 0 16px}.toolbar{display:flex;gap:8px;position:sticky;top:0;background:#f5f6f8;padding:0 0 12px;z-index:2}.settings button{border:0;border-radius:9px;padding:11px 13px;font-weight:800;background:#1677ff;color:#fff}.settings button.secondary{background:#e4e8ed;color:#1d2832}.settings button.danger{background:#c83c3c}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#59636d;margin-bottom:4px}.field input,.field select{width:100%;font:inherit;padding:11px;border:1px solid #c9cfd5;border-radius:9px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:12px;padding:12px;margin:12px 0}.cardtop{display:flex;justify-content:space-between;align-items:center}.cardtop b{font-size:18px}.smallbuttons button{padding:7px 9px;margin-left:4px}.hint{font-size:12px;color:#68727c;line-height:1.5}.empty{text-align:center;color:#9aa2a9;padding:50px 15px}.soon{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.55}}@media(max-width:520px){.head,.row{grid-template-columns:1fr 1fr 2.15fr .55fr}.row{padding:11px 10px;min-height:96px}.head{padding:9px 10px}.dest{font-size:clamp(23px,6.1vw,34px)}}@media(orientation:landscape){.top{padding-top:10px}.row{min-height:82px}.board{padding-bottom:36px}.ticker{height:36px;line-height:36px}.gear{bottom:48px}}
</style></head><body>
<main class="board"><div class="top"><div><div class="brand" id="brandView"></div><div class="station" id="stationView"></div></div><div class="clock" id="clock">--:--:--</div></div><div class="head"><div>時刻<br>Time</div><div>種別<br>Type</div><div>行先 / Destination</div><div>番線</div></div><div id="rows"></div></main><div class="ticker"><span id="tickerView"></span></div><button class="gear" id="openSettings" aria-label="設定">⚙︎</button>
<section class="settings" id="settings"><div class="toolbar"><button id="save">保存して戻る</button><button class="secondary" id="close">キャンセル</button></div><h2>発車標の設定</h2><div class="two"><div class="field"><label>鉄道会社名</label><input id="brandInput"></div><div class="field"><label>駅名</label><input id="stationInput"></div></div><div class="field"><label>案内テロップ</label><input id="tickerInput"></div><div class="two"><div class="field"><label>表示言語</label><select id="langInput"><option value="auto">日本語 ⇄ English 自動</option><option value="ja">日本語</option><option value="en">English</option></select></div><div class="field"><label>自動繰り上げ</label><select id="rollInput"><option value="yes">する</option><option value="no">しない</option></select></div></div><h2>列車</h2><div id="editors"></div><button id="add">＋ 列車を追加</button><p class="hint">発車時刻を過ぎた列車は「自動繰り上げ」が有効な場合に表示から外れます。設定はこのiPhoneに保存されます。</p></section>
<script>
const seed={brand:'架空鉄道',station:'江川',ticker:'ご乗車ありがとうございます。黄色い線の内側でお待ちください。　Thank you for traveling with us.',lang:'auto',roll:'no',trains:[{time:'23:42',type:'快速',typeEn:'Rapid',dest:'海浜中央',destEn:'Kaihin-Chuo',track:'3',note:''},{time:'23:51',type:'各駅停車',typeEn:'Local',dest:'新都心',destEn:'Shintoshin',track:'3',note:'当駅始発'},{time:'00:03',type:'特急',typeEn:'Limited Exp.',dest:'空港第2ターミナル',destEn:'Airport Terminal 2',track:'4',note:''}]};
let data=JSON.parse(localStorage.getItem('fictionRailBoardV2')||'null')||seed;let autoEn=false;const $=x=>document.getElementById(x);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function mins(t){let[a,b]=t.split(':').map(Number);return a*60+b}function visible(){if(data.roll!=='yes')return data.trains;let n=new Date(),now=n.getHours()*60+n.getMinutes();return data.trains.filter(t=>{let m=mins(t.time);let d=m-now;if(d<-720)d+=1440;if(d>720)d-=1440;return d>=0}).sort((a,b)=>{let da=mins(a.time)-now,db=mins(b.time)-now;if(da<-720)da+=1440;if(db<-720)db+=1440;return da-db})}function isEn(){return data.lang==='en'||(data.lang==='auto'&&autoEn)}function render(){let en=isEn();$('brandView').textContent=data.brand;$('stationView').textContent=data.station;$('tickerView').textContent=data.ticker;let list=visible().slice(0,4);$('rows').innerHTML=list.length?list.map(t=>`<div class="row"><div class="time">${esc(t.time)}</div><div><span class="badge">${esc(en?t.typeEn:t.type)}</span>${t.note?`<div class="status">${esc(t.note)}</div>`:''}</div><div class="dest">${esc(en?t.destEn:t.dest)}<small>${esc(en?t.dest:t.destEn)}</small></div><div class="track">${esc(t.track)}</div></div>`).join(''):'<div class="empty">現在表示する列車はありません</div>'}function makeEditors(){ $('brandInput').value=data.brand;$('stationInput').value=data.station;$('tickerInput').value=data.ticker;$('langInput').value=data.lang;$('rollInput').value=data.roll;$('editors').innerHTML=data.trains.map((t,i)=>`<div class="card" data-card="${i}"><div class="cardtop"><b>${i+1}本目</b><div class="smallbuttons"><button class="secondary" onclick="moveTrain(${i},-1)">↑</button><button class="secondary" onclick="moveTrain(${i},1)">↓</button><button class="danger" onclick="delTrain(${i})">削除</button></div></div><div class="two"><div class="field"><label>時刻</label><input data-i="${i}" data-k="time" value="${esc(t.time)}"></div><div class="field"><label>番線</label><input data-i="${i}" data-k="track" value="${esc(t.track)}"></div><div class="field"><label>種別</label><input data-i="${i}" data-k="type" value="${esc(t.type)}"></div><div class="field"><label>Type</label><input data-i="${i}" data-k="typeEn" value="${esc(t.typeEn)}"></div><div class="field"><label>行先</label><input data-i="${i}" data-k="dest" value="${esc(t.dest)}"></div><div class="field"><label>Destination</label><input data-i="${i}" data-k="destEn" value="${esc(t.destEn)}"></div></div><div class="field"><label>備考（当駅始発・遅れ約5分 など）</label><input data-i="${i}" data-k="note" value="${esc(t.note||'')}"></div></div>`).join('')}
function pull(){data.brand=$('brandInput').value;data.station=$('stationInput').value;data.ticker=$('tickerInput').value;data.lang=$('langInput').value;data.roll=$('rollInput').value;document.querySelectorAll('[data-i]').forEach(x=>data.trains[+x.dataset.i][x.dataset.k]=x.value)}window.moveTrain=(i,d)=>{pull();let j=i+d;if(j<0||j>=data.trains.length)return;[data.trains[i],data.trains[j]]=[data.trains[j],data.trains[i]];makeEditors()};window.delTrain=i=>{pull();data.trains.splice(i,1);makeEditors()};$('add').onclick=()=>{pull();data.trains.push({time:'12:00',type:'各駅停車',typeEn:'Local',dest:'中央',destEn:'Chuo',track:'1',note:''});makeEditors();setTimeout(()=>document.querySelector('[data-card="'+(data.trains.length-1)+'"]')?.scrollIntoView({behavior:'smooth'}),50)};$('openSettings').onclick=()=>{makeEditors();$('settings').classList.add('open')};$('close').onclick=()=>$('settings').classList.remove('open');$('save').onclick=()=>{pull();localStorage.setItem('fictionRailBoardV2',JSON.stringify(data));render();$('settings').classList.remove('open')};setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour12:false});render()},1000);setInterval(()=>{if(data.lang==='auto'){autoEn=!autoEn;render()}},7000);render();
</script></body></html>
