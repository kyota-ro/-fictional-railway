function trainDelta(t){if(t._dep)return (t._dep-Date.now())/1000;return delta(t.time)}
function upcoming(r){let src=(r.patterns?generatedTrains(r):(r.trains||[]).map(x=>clone(x)));return src.sort((a,b)=>trainDelta(a)-trainDelta(b)).filter(t=>trainDelta(t)>-30)}function status(t){let d=trainDelta(t),s=data.settings;if(d<=s.departingSec&&d>=0)return'まもなく発車';if(d<=s.stoppedSec&&d>=0)return'停車中';if(d<=s.arrivalSec&&d>=0)return'まもなく到着';return''}function currentIndex(t){let st=t.stops||[],s=data.settings;if(!st.length)return-1;if(s.currentMode==='stations')return Math.max(0,st.length-1-s.currentStations);let d=Math.max(0,trainDelta(t));let mins=d/60;let back=Math.ceil(mins/Math.max(.1,s.currentMinutes));return Math.max(0,st.length-1-back)}function stopsHtml(t,showCurrent=true){let tp=route().types[t.type]||{bg:'#2680d9'},idx=currentIndex(t),phase=Math.floor(Date.now()/1000/data.settings.currentAlternateSec)%2;return`<div class="stops" style="--svc:${esc(tp.bg)}">${(t.stops||[]).map((x,i)=>`<span class="stop ${showCurrent&&phase&&i===idx?'current':''}">${esc(x)}</span>`).join('')}</div>`}function badge(t){let tp=route().types[t.type]||{ja:t.type,en:t.type,bg:'#555',fg:'#fff'};return`<span class="badge" style="background:${tp.bg};color:${tp.fg}">${esc(tp.ja)}</span>`}function noticeHtml(){let phase=((Date.now()/1000)%20).toFixed(2);let txt=String(data.notices[0]||'').replace(/^【お知らせ】\s*/, '');return`<div class="notice"><span style="animation-delay:-${phase}s"><b>【お知らせ】</b> ${esc(txt)}</span></div>`}
function render(){let r=route();if(!r)return;let list=upcoming(r),mode=data.mode;if(mode==='concourse'){let rows=list.slice(0,6).map(t=>`<div class="train"><div class="time">${t.time}</div><div>${badge(t)}</div><div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div><div>${stopsHtml(t,true)}</div><div class="status">${status(t)}</div></div>`).join('');$('display').innerHTML=`<div class="concourse"><div class="panel"><div class="routeHead" style="--line:${r.lineColor}"><div class="code">${esc(r.code)}</div><div><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div></div></div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div><div>停車駅一覧</div><div>案内</div></div>${rows}${noticeHtml()}</div></div>`}else{let pl=data.selected.platform,fl=list.filter(t=>String(t.platform)===String(pl)).slice(0,3),cycle=Math.floor(Date.now()/1000),showStops=fl[0]&&cycle%(data.settings.platformStopEvery+8)<8,showNotice=cycle%data.settings.platformNoticeEvery<data.settings.platformNoticeDuration,arrival=fl[0]&&trainDelta(fl[0])<=data.settings.arrivalSec&&trainDelta(fl[0])>0;let row=t=>`<div class="train"><div class="time">${t.time}</div><div>${badge(t)}</div><div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div></div>`;let body='';if(fl[0])body+=row(fl[0]);if(showStops&&fl[0])body+=`<div class="platformAlt stopPanel">${stopsHtml(fl[0],true)}</div>`;else if(fl[1])body+=row(fl[1]);if(arrival)body+=`<div class="platformAlt arrival">まもなく電車がまいります</div>`;else if(showNotice)body+=`<div class="platformAlt noticeSlot">${noticeHtml()}</div>`;else if(showStops&&fl[1])body+=row(fl[1]);else if(fl[2])body+=row(fl[2]);$('display').innerHTML=`<div class="platform panel" style="--line:${r.lineColor}"><aside class="platformInfo"><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div><div class="platformNo">${esc(pl)}</div><div class="direction">${esc(r.direction)}</div><div class="sub">${esc(r.directionEn)}</div><div class="sub through" style="margin-top:5px">直通先：${esc(r.through)}</div><div class="codes"><span class="miniCode">${esc(r.code)}</span></div></aside><section class="platformRight"><div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div></div>${body}</div></section></div>`}}
$('settingsBtn').onclick=()=>{draft=clone(data);tab='select';settingsRender();$('settings').classList.add('open')};$('cancelBtn').onclick=()=>$('settings').classList.remove('open');$('saveBtn').onclick=()=>{pullTab();data=draft;persist();render();$('settings').classList.remove('open')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{pullTab();tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary');settingsRender()});$('modeBtn').onclick=()=>{data.mode=data.mode==='platform'?'concourse':'platform';persist();render()};let lastRenderKey='';function refresh(){let n=new Date();$('clock').textContent=n.toLocaleTimeString('ja-JP',{hour12:false});let r=route();if(!r)return;let u=upcoming(r),first=u[0];let key=[data.mode,data.selected.station,data.selected.route,data.selected.platform,first?first.time:'',first?status(first):'',Math.floor(Date.now()/1000/Math.max(1,data.settings.currentAlternateSec)),data.mode==='platform'?Math.floor(Date.now()/1000/Math.max(1,data.settings.platformStopEvery)):0,data.mode==='platform'?Math.floor(Date.now()/1000/Math.max(1,data.settings.platformNoticeEvery)):0].join('|');if(key!==lastRenderKey){lastRenderKey=key;render()}}setInterval(refresh,1000);refresh();
</script></body></html>
