<script>
const seed={selected:{station:'上野駅',route:'東海道線',platform:'2'},mode:'platform',settings:{platformStopEvery:12,platformNoticeEvery:30,platformNoticeDuration:8,arrivalSec:105,stoppedSec:50,departingSec:15,currentMode:'time',currentMinutes:3,currentStations:2,currentAlternateSec:5},stations:{'上野駅':{code:'UEN',routes:{'東海道線':{code:'JU',name:'東海道線（上野東京ライン）',nameEn:'Tokaido Line (Ueno-Tokyo Line)',direction:'東京・品川方面',directionEn:'for Tokyo & Shinagawa',through:'宇都宮・高崎・常磐線',lineColor:'#e87518',platforms:['2','3'],types:{'各駅停車':{ja:'各駅停車',en:'Local',bg:'#18894c',fg:'#fff'},'快速':{ja:'快速',en:'Rapid',bg:'#176bc1',fg:'#fff'},'特急':{ja:'特急',en:'Limited Exp.',bg:'#bd2057',fg:'#fff'}},stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','籠原','本庄','高崎'],trains:[{time:'14:55',type:'快速',origin:true,dest:'籠原',destEn:'Kagohara',cars:'10',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','籠原']},{time:'15:00',type:'各駅停車',origin:false,dest:'土浦',destEn:'Tsuchiura',cars:'15',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','北千住','松戸','柏','我孫子','取手','牛久','土浦']},{time:'15:05',type:'特急',origin:true,dest:'宇都宮',destEn:'Utsunomiya',cars:'10',platform:'3',stops:['上野','大宮','小山','宇都宮']},{time:'15:12',type:'各駅停車',origin:false,dest:'桐生',destEn:'Kiryu',cars:'15',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','高崎','桐生']},{time:'15:20',type:'快速',origin:false,dest:'新前橋',destEn:'Shin-Maebashi',cars:'10',platform:'3',stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','本庄','新前橋']},{time:'15:27',type:'各駅停車',origin:false,dest:'小金井',destEn:'Koganei',cars:'15',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','小山','小金井']},{time:'15:35',type:'特急',origin:false,dest:'高崎',destEn:'Takasaki',cars:'10',platform:'4',stops:['上野','大宮','熊谷','本庄','高崎']}]}}}},notices:['【お知らせ】 車内で不審物を見かけた際は、係員までお知らせください。']};
/* IMPORTANT: keep this key stable so existing user data survives HTML updates. */
const KEY='fictionRailwayBoardV6';const LEGACY_KEYS=['fictionRailwayBoardV5','fictionRailwayBoardV4','fictionRailwayBoardV3','fictionRailwayBoardV2','fictionRailwayBoard'];
function safeParse(v){try{return JSON.parse(v)}catch(e){return null}}
function normalizeData(x){if(!x||typeof x!=='object')return null;if(!x.stations)return null;x.settings=Object.assign({},seed.settings,x.settings||{});x.notices=Array.isArray(x.notices)?x.notices:clone(seed.notices);x.mode=x.mode||'platform';for(const sn of Object.keys(x.stations||{})){const st=x.stations[sn];st.routes=st.routes||{};for(const rn of Object.keys(st.routes)){const r=st.routes[rn];r.platforms=Array.isArray(r.platforms)&&r.platforms.length?r.platforms:['1'];r.types=r.types||clone(seed.stations['上野駅'].routes['東海道線'].types);r.trains=Array.isArray(r.trains)?r.trains:[];ensurePatterns(r)}}if(!x.selected||!x.stations[x.selected.station]){const sn=Object.keys(x.stations)[0];if(!sn)return null;const rn=Object.keys(x.stations[sn].routes)[0];x.selected={station:sn,route:rn,platform:x.stations[sn].routes[rn].platforms[0]}}else{const st=x.stations[x.selected.station];if(!st.routes[x.selected.route])x.selected.route=Object.keys(st.routes)[0];const r=st.routes[x.selected.route];if(!r.platforms.includes(String(x.selected.platform)))x.selected.platform=r.platforms[0]}return x}
function loadData(){let cur=normalizeData(safeParse(localStorage.getItem(KEY)));if(cur)return cur;for(const k of LEGACY_KEYS){const old=normalizeData(safeParse(localStorage.getItem(k)));if(old){localStorage.setItem(KEY,JSON.stringify(old));localStorage.setItem(KEY+'_migration_source',k);return old}}return clone(seed)}
let data=loadData();let draft=null,tab='select';const $=x=>document.getElementById(x),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clone(x){return JSON.parse(JSON.stringify(x))}function persist(){const raw=JSON.stringify(data);localStorage.setItem(KEY,raw);localStorage.setItem(KEY+'_autosave',raw);localStorage.setItem(KEY+'_savedAt',new Date().toISOString())}function route(d=data){let s=d.stations[d.selected.station];return s?.routes[d.selected.route]}function secs(t){let p=String(t).trim().split(':').map(Number);if(p.length===1)return p[0]*60;return p[0]*3600+p[1]*60}function delta(t){let n=new Date(),d=secs(t)-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds());if(d<-43200)d+=86400;if(d>43200)d-=86400;return d}function ensurePatterns(r){if(!r.patterns){r.patterns={'基本':clone(r.trains||[])};r.hourAssignments={};for(let h=0;h<24;h++)r.hourAssignments[h]='基本'}if(!r.hourAssignments)r.hourAssignments={};let first=Object.keys(r.patterns)[0]||'基本';for(let h=0;h<24;h++)if(!r.hourAssignments[h])r.hourAssignments[h]=first;if(!r.activePattern||!r.patterns[r.activePattern])r.activePattern=first}
function generatedTrains(r){ensurePatterns(r);let now=new Date(),out=[];for(let off=-1;off<=2;off++){let d=new Date(now);d.setMinutes(0,0,0);d.setHours(d.getHours()+off);let h=d.getHours(),pat=r.hourAssignments[h],arr=r.patterns[pat]||[];for(let t of arr){let raw=String(t.time||'').trim(),hh,mm;if(raw.includes(':')){[hh,mm]=raw.split(':').map(Number)}else{hh=h;mm=Number(raw)}if(!Number.isFinite(mm))continue;let dep=new Date(d);dep.setHours(hh,mm,0,0);if(!raw.includes(':'))dep.setHours(h,mm,0,0);let c=clone(t);c._dep=dep.getTime();c.time=String(dep.getHours()).padStart(2,'0')+':'+String(dep.getMinutes()).padStart(2,'0');out.push(c)}}return out.sort((a,b)=>a._dep-b._dep)}
function trainDelta(t){if(t._dep)return (t._dep-Date.now())/1000;return delta(t.time)}
function upcoming(r){let src=(r.patterns?generatedTrains(r):(r.trains||[]).map(x=>clone(x)));return src.sort((a,b)=>trainDelta(a)-trainDelta(b)).filter(t=>trainDelta(t)>-30)}function status(t){let d=trainDelta(t),s=data.settings;if(d<=s.departingSec&&d>=0)return'まもなく発車';if(d<=s.stoppedSec&&d>=0)return'停車中';if(d<=s.arrivalSec&&d>=0)return'まもなく到着';return''}function currentIndex(t){let st=t.stops||[],s=data.settings;if(!st.length)return-1;if(s.currentMode==='stations')return Math.max(0,st.length-1-s.currentStations);let d=Math.max(0,trainDelta(t));let mins=d/60;let back=Math.ceil(mins/Math.max(.1,s.currentMinutes));return Math.max(0,st.length-1-back)}function stopsHtml(t,showCurrent=true){let tp=route().types[t.type]||{bg:'#2680d9'},idx=currentIndex(t),phase=Math.floor(Date.now()/1000/data.settings.currentAlternateSec)%2;return`<div class="stops" style="--svc:${esc(tp.bg)}">${(t.stops||[]).map((x,i)=>`<span class="stop ${showCurrent&&phase&&i===idx?'current':''}">${esc(x)}</span>`).join('')}</div>`}function badge(t){let tp=route().types[t.type]||{ja:t.type,en:t.type,bg:'#555',fg:'#fff'};return`<span class="badge" style="background:${tp.bg};color:${tp.fg}">${esc(tp.ja)}</span>`}function noticeHtml(){const dur=20;let phase=((Date.now()/1000)%dur).toFixed(2);let txt=String(data.notices[0]||'').replace(/^【お知らせ】\s*/, '');return`<div class="notice"><div class="noticeWindow"><span class="noticeTrack" style="animation-delay:-${phase}s"><b>【お知らせ】</b> ${esc(txt)}</span></div></div>`}
function render(){let r=route();if(!r)return;let list=upcoming(r),mode=data.mode;if(mode==='concourse'){let rows=list.slice(0,6).map(t=>`<div class="train"><div class="time">${t.time}</div><div>${badge(t)}</div><div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div><div>${stopsHtml(t,true)}</div><div class="status">${status(t)}</div></div>`).join('');$('display').innerHTML=`<div class="concourse"><div class="panel"><div class="routeHead" style="--line:${r.lineColor}"><div class="code">${esc(r.code)}</div><div><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div></div></div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div><div>停車駅一覧</div><div>案内</div></div>${rows}${noticeHtml()}</div></div>`}else{let pl=data.selected.platform,fl=list.filter(t=>String(t.platform)===String(pl)).slice(0,3),cycle=Math.floor(Date.now()/1000),showStops=fl[0]&&cycle%(data.settings.platformStopEvery+8)<8,showNotice=cycle%data.settings.platformNoticeEvery<data.settings.platformNoticeDuration,arrival=fl[0]&&trainDelta(fl[0])<=data.settings.arrivalSec&&trainDelta(fl[0])>0;let row=t=>`<div class="train"><div class="time">${t.time}</div><div>${badge(t)}</div><div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div></div>`;let body='';if(fl[0])body+=row(fl[0]);if(showStops&&fl[0])body+=`<div class="platformAlt stopPanel">${stopsHtml(fl[0],true)}</div>`;else if(fl[1])body+=row(fl[1]);if(arrival)body+=`<div class="platformAlt arrival">まもなく電車がまいります</div>`;else if(showNotice)body+=`<div class="platformAlt noticeSlot">${noticeHtml()}</div>`;else if(showStops&&fl[1])body+=row(fl[1]);else if(fl[2])body+=row(fl[2]);$('display').innerHTML=`<div class="platform panel" style="--line:${r.lineColor}"><aside class="platformInfo"><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div><div class="platformNo">${esc(pl)}</div><div class="direction">${esc(r.direction)}</div><div class="sub">${esc(r.directionEn)}</div><div class="sub through" style="margin-top:5px">直通先：${esc(r.through)}</div><div class="codes"><span class="miniCode">${esc(r.code)}</span></div></aside><section class="platformRight"><div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div></div>${body}</div></section></div>`}}

function settingsRender(){
  if(!draft) draft=clone(data);
  const body=$('settingsBody'); const r=route(draft); const st=draft.stations[draft.selected.station];
  const stationOpts=Object.keys(draft.stations).map(x=>`<option ${x===draft.selected.station?'selected':''}>${esc(x)}</option>`).join('');
  const routeOpts=Object.keys(st.routes).map(x=>`<option ${x===draft.selected.route?'selected':''}>${esc(x)}</option>`).join('');
  const platformOpts=(r.platforms||[]).map(x=>`<option ${String(x)===String(draft.selected.platform)?'selected':''}>${esc(x)}</option>`).join('');
  if(tab==='select') body.innerHTML=`<div class="card"><h2>表示する駅・路線・番線</h2><div class="field"><label>駅</label><select id="selStation">${stationOpts}</select></div><div class="field"><label>路線</label><select id="selRoute">${routeOpts}</select></div><div class="field"><label>ホーム番線</label><select id="selPlatform">${platformOpts}</select></div><div class="two"><button id="addStation">＋ 駅を追加</button><button id="addRoute">＋ この駅に路線を追加</button></div></div>`;
  else if(tab==='edit') body.innerHTML=`<div class="card"><h2>基本情報</h2><div class="two"><div class="field"><label>路線名</label><input id="eName" value="${esc(r.name)}"></div><div class="field"><label>英語路線名</label><input id="eNameEn" value="${esc(r.nameEn)}"></div><div class="field"><label>ナンバリング</label><input id="eCode" value="${esc(r.code)}"></div><div class="field"><label>路線カラー</label><input id="eColor" type="color" value="${esc(r.lineColor||'#1687d9')}"></div><div class="field"><label>方面</label><input id="eDirection" value="${esc(r.direction||'')}"></div><div class="field"><label>英語方面</label><input id="eDirectionEn" value="${esc(r.directionEn||'')}"></div></div><div class="field"><label>直通先</label><input id="eThrough" value="${esc(r.through||'')}"></div><div class="field"><label>番線（カンマ区切り）</label><input id="ePlatforms" value="${esc((r.platforms||[]).join(','))}"></div></div>`;
  else if(tab==='types') body.innerHTML=`<div class="card"><h2>種別テンプレート</h2><div id="typeRows">${Object.entries(r.types||{}).map(([k,v])=>`<div class="rowEdit"><div class="field"><label>日本語</label><input class="typeJa" data-old="${esc(k)}" value="${esc(v.ja||k)}"></div><div class="field"><label>英語</label><input class="typeEn" value="${esc(v.en||'')}"></div><input class="typeBg" type="color" value="${esc(v.bg||'#555555')}"></div>`).join('')}</div><button id="addType">＋ 種別を追加</button></div>`;
  else if(tab==='timetable'){ensurePatterns(r); let pat=r.activePattern||Object.keys(r.patterns)[0]; let txt=(r.patterns[pat]||[]).map(t=>[t.time,t.type,t.origin?1:0,t.dest,t.destEn||'',t.cars||'',t.platform||'',(t.stops||[]).join(',')].join('|')).join('\n'); body.innerHTML=`<div class="card"><h2>時刻表</h2><div class="field"><label>編集するパターン</label><select id="activePattern">${Object.keys(r.patterns).map(x=>`<option ${x===pat?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>時刻|種別|当駅始発(1/0)|行先|英語行先|両数|番線|停車駅(,区切り)</label><textarea id="ttText">${esc(txt)}</textarea></div></div>`}
  else if(tab==='patterns'){ensurePatterns(r); body.innerHTML=`<div class="card"><h2>時間帯パターン</h2><div class="field"><label>パターン名（カンマ区切り）</label><input id="patternNames" value="${esc(Object.keys(r.patterns).join(','))}"></div><div class="hourGrid">${Array.from({length:24},(_,h)=>`<div class="hourCell"><b>${h}時</b><select data-hour="${h}">${Object.keys(r.patterns).map(x=>`<option ${r.hourAssignments[h]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}</div></div>`}
  else if(tab==='stops') body.innerHTML=`<div class="card"><h2>停車駅・現在位置</h2><div class="field"><label>路線の駅一覧（カンマ区切り）</label><textarea id="routeStops">${esc((r.stops||[]).join(','))}</textarea></div><div class="three"><div class="field"><label>現在位置：何分で1駅</label><input id="curMin" type="number" step="0.1" value="${draft.settings.currentMinutes}"></div><div class="field"><label>終点の何駅前</label><input id="curStations" type="number" value="${draft.settings.currentStations}"></div><div class="field"><label>交互表示秒数</label><input id="curAlt" type="number" value="${draft.settings.currentAlternateSec}"></div></div></div>`;
  else if(tab==='notice') body.innerHTML=`<div class="card"><h2>お知らせ</h2><div class="field"><label>お知らせ（1行1件）</label><textarea id="noticeText">${esc((draft.notices||[]).join('\n'))}</textarea></div><div class="three"><div class="field"><label>ホーム表示周期(秒)</label><input id="noticeEvery" type="number" value="${draft.settings.platformNoticeEvery}"></div><div class="field"><label>表示時間(秒)</label><input id="noticeDuration" type="number" value="${draft.settings.platformNoticeDuration}"></div><div class="field"><label>停車駅表示周期(秒)</label><input id="stopEvery" type="number" value="${draft.settings.platformStopEvery}"></div></div></div>`;
  else if(tab==='backup') body.innerHTML=`<div class="card"><h2>バックアップ</h2><div class="field"><label>JSON</label><textarea id="backupText">${esc(JSON.stringify(draft,null,2))}</textarea></div><button id="restoreBackup">このJSONから復元</button></div>`;
  bindSettingsControls();
}
function parseTimetable(txt){return String(txt||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{let a=line.split('|');return {time:(a[0]||'').trim(),type:(a[1]||'').trim(),origin:String(a[2]||'0').trim()==='1',dest:(a[3]||'').trim(),destEn:(a[4]||'').trim(),cars:(a[5]||'').trim(),platform:(a[6]||'').trim(),stops:(a[7]||'').split(',').map(x=>x.trim()).filter(Boolean)}})}
function pullTab(){if(!draft)return;const r=route(draft); if(tab==='select'){let a=$('selStation'),b=$('selRoute'),c=$('selPlatform');if(a)draft.selected.station=a.value;if(b&&draft.stations[draft.selected.station]?.routes[b.value])draft.selected.route=b.value;if(c)draft.selected.platform=c.value}
 else if(tab==='edit'&&$('eName')){r.name=$('eName').value;r.nameEn=$('eNameEn').value;r.code=$('eCode').value;r.lineColor=$('eColor').value;r.direction=$('eDirection').value;r.directionEn=$('eDirectionEn').value;r.through=$('eThrough').value;r.platforms=$('ePlatforms').value.split(',').map(x=>x.trim()).filter(Boolean);if(!r.platforms.includes(String(draft.selected.platform)))draft.selected.platform=r.platforms[0]||'1'}
 else if(tab==='types'&&document.querySelector('.typeJa')){let n={};document.querySelectorAll('.typeJa').forEach((el,i)=>{let ja=el.value.trim();if(ja)n[ja]={ja,en:document.querySelectorAll('.typeEn')[i].value,bg:document.querySelectorAll('.typeBg')[i].value,fg:'#fff'}});r.types=n}
 else if(tab==='timetable'&&$('ttText')){ensurePatterns(r);let p=$('activePattern').value;r.activePattern=p;r.patterns[p]=parseTimetable($('ttText').value)}
 else if(tab==='patterns'&&$('patternNames')){ensurePatterns(r);let names=$('patternNames').value.split(',').map(x=>x.trim()).filter(Boolean);let np={};names.forEach(n=>np[n]=r.patterns[n]||[]);if(!names.length){names=['基本'];np['基本']=[]}r.patterns=np;document.querySelectorAll('[data-hour]').forEach(x=>r.hourAssignments[x.dataset.hour]=names.includes(x.value)?x.value:names[0]);r.activePattern=names.includes(r.activePattern)?r.activePattern:names[0]}
 else if(tab==='stops'&&$('routeStops')){r.stops=$('routeStops').value.split(',').map(x=>x.trim()).filter(Boolean);draft.settings.currentMinutes=+$('curMin').value||3;draft.settings.currentStations=+$('curStations').value||2;draft.settings.currentAlternateSec=+$('curAlt').value||5}
 else if(tab==='notice'&&$('noticeText')){draft.notices=$('noticeText').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);draft.settings.platformNoticeEvery=+$('noticeEvery').value||30;draft.settings.platformNoticeDuration=+$('noticeDuration').value||8;draft.settings.platformStopEvery=+$('stopEvery').value||12}}
function bindSettingsControls(){
 const ss=$('selStation');if(ss)ss.onchange=()=>{draft.selected.station=ss.value;let st=draft.stations[ss.value];draft.selected.route=Object.keys(st.routes)[0];draft.selected.platform=st.routes[draft.selected.route].platforms[0];settingsRender()};
 const sr=$('selRoute');if(sr)sr.onchange=()=>{draft.selected.route=sr.value;draft.selected.platform=route(draft).platforms[0];settingsRender()}; const sp=$('selPlatform');if(sp)sp.onchange=()=>draft.selected.platform=sp.value;
 const as=$('addStation');if(as)as.onclick=()=>{let n=prompt('駅名');if(!n||draft.stations[n])return;draft.stations[n]={code:'',routes:{'新しい路線':clone(seed.stations['上野駅'].routes['東海道線'])}};draft.selected={station:n,route:'新しい路線',platform:'2'};settingsRender()};
 const ar=$('addRoute');if(ar)ar.onclick=()=>{let n=prompt('路線名');if(!n||draft.stations[draft.selected.station].routes[n])return;draft.stations[draft.selected.station].routes[n]=clone(seed.stations['上野駅'].routes['東海道線']);draft.stations[draft.selected.station].routes[n].name=n;draft.selected.route=n;draft.selected.platform='2';settingsRender()};
 const at=$('addType');if(at)at.onclick=()=>{pullTab();route(draft).types['新種別']={ja:'新種別',en:'Service',bg:'#555555',fg:'#fff'};settingsRender()};
 const ap=$('activePattern');if(ap)ap.onchange=()=>{pullTab();route(draft).activePattern=ap.value;settingsRender()};
 const rb=$('restoreBackup');if(rb)rb.onclick=()=>{let x=normalizeData(safeParse($('backupText').value));if(!x)return alert('JSONを読み取れませんでした');draft=x;tab='select';settingsRender();alert('読み込みました。「保存して戻る」で確定します。')};
}
function openSettings(){draft=clone(data);tab='select';settingsRender();$('settings').classList.add('open');document.body.style.overflow='hidden'}
function closeSettings(){ $('settings').classList.remove('open');document.body.style.overflow=''}
$('settingsBtn').addEventListener('click',openSettings);$('settingsBtn').addEventListener('touchend',e=>{e.preventDefault();openSettings()},{passive:false});
$('cancelBtn').onclick=closeSettings;$('saveBtn').onclick=()=>{pullTab();data=draft;persist();lastRenderKey='';render();closeSettings()};
