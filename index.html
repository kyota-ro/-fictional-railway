<script>
const seed={selected:{station:'上野駅',route:'東海道線',platform:'2'},mode:'platform',settings:{platformStopEvery:12,platformNoticeEvery:30,platformNoticeDuration:8,arrivalSec:105,stoppedSec:50,departingSec:15,currentMode:'time',currentMinutes:3,currentStations:2,currentAlternateSec:5},stations:{'上野駅':{code:'UEN',routes:{'東海道線':{code:'JU',name:'東海道線（上野東京ライン）',nameEn:'Tokaido Line (Ueno-Tokyo Line)',direction:'東京・品川方面',directionEn:'for Tokyo & Shinagawa',through:'宇都宮・高崎・常磐線',lineColor:'#e87518',platforms:['2','3'],types:{'各駅停車':{ja:'各駅停車',en:'Local',bg:'#18894c',fg:'#fff'},'快速':{ja:'快速',en:'Rapid',bg:'#176bc1',fg:'#fff'},'特急':{ja:'特急',en:'Limited Exp.',bg:'#bd2057',fg:'#fff'}},stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','籠原','本庄','高崎'],trains:[{time:'14:55',type:'快速',origin:true,dest:'籠原',destEn:'Kagohara',cars:'10',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','籠原']},{time:'15:00',type:'各駅停車',origin:false,dest:'土浦',destEn:'Tsuchiura',cars:'15',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','北千住','松戸','柏','我孫子','取手','牛久','土浦']},{time:'15:05',type:'特急',origin:true,dest:'宇都宮',destEn:'Utsunomiya',cars:'10',platform:'3',stops:['上野','大宮','小山','宇都宮']},{time:'15:12',type:'各駅停車',origin:false,dest:'桐生',destEn:'Kiryu',cars:'15',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','高崎','桐生']},{time:'15:20',type:'快速',origin:false,dest:'新前橋',destEn:'Shin-Maebashi',cars:'10',platform:'3',stops:['上野','尾久','赤羽','浦和','大宮','上尾','桶川','北本','鴻巣','熊谷','本庄','新前橋']},{time:'15:27',type:'各駅停車',origin:false,dest:'小金井',destEn:'Koganei',cars:'15',platform:'2',stops:['上野','尾久','赤羽','浦和','大宮','小山','小金井']},{time:'15:35',type:'特急',origin:false,dest:'高崎',destEn:'Takasaki',cars:'10',platform:'4',stops:['上野','大宮','熊谷','本庄','高崎']}]}}}},notices:['【お知らせ】 車内で不審物を見かけた際は、係員までお知らせください。']};
const KEY='fictionRailwayBoardV6';const LEGACY_KEYS=['fictionRailwayBoardV5','fictionRailwayBoardV4','fictionRailwayBoardV3','fictionRailwayBoardV2','fictionRailwayBoard'];
function safeParse(v){try{return JSON.parse(v)}catch(e){return null}}
function normalizeData(x){if(!x||typeof x!=='object')return null;if(!x.stations)return null;x.settings=Object.assign({},seed.settings,x.settings||{});x.notices=Array.isArray(x.notices)?x.notices:clone(seed.notices);x.mode=x.mode||'platform';for(const sn of Object.keys(x.stations||{})){const st=x.stations[sn];st.routes=st.routes||{};for(const rn of Object.keys(st.routes)){const r=st.routes[rn];r.platforms=Array.isArray(r.platforms)&&r.platforms.length?r.platforms:['1'];r.types=r.types||clone(seed.stations['上野駅'].routes['東海道線'].types);r.trains=Array.isArray(r.trains)?r.trains:[];ensurePatterns(r)}}if(!x.selected||!x.stations[x.selected.station]){const sn=Object.keys(x.stations)[0];if(!sn)return null;const rn=Object.keys(x.stations[sn].routes)[0];x.selected={station:sn,route:rn,platform:x.stations[sn].routes[rn].platforms[0]}}else{const st=x.stations[x.selected.station];if(!st.routes[x.selected.route])x.selected.route=Object.keys(st.routes)[0];const r=st.routes[x.selected.route];if(!r.platforms.includes(String(x.selected.platform)))x.selected.platform=r.platforms[0]}return x}
function loadData(){let cur=normalizeData(safeParse(localStorage.getItem(KEY)));if(cur)return cur;for(const k of LEGACY_KEYS){const old=normalizeData(safeParse(localStorage.getItem(k)));if(old){localStorage.setItem(KEY,JSON.stringify(old));localStorage.setItem(KEY+'_migration_source',k);return old}}return clone(seed)}
let data=loadData();let draft=null,tab='select';const $=x=>document.getElementById(x),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clone(x){return JSON.parse(JSON.stringify(x))}function persist(){const raw=JSON.stringify(data);localStorage.setItem(KEY,raw);localStorage.setItem(KEY+'_autosave',raw);localStorage.setItem(KEY+'_savedAt',new Date().toISOString())}function route(d=data){let s=d.stations[d.selected.station];return s?.routes[d.selected.route]}function secs(t){let p=String(t).trim().split(':').map(Number);if(p.length===1)return p[0]*60;return p[0]*3600+p[1]*60}function delta(t){let n=new Date(),d=secs(t)-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds());if(d<-43200)d+=86400;if(d>43200)d-=86400;return d}function ensurePatterns(r){if(!r.patterns){r.patterns={'基本':clone(r.trains||[])};r.hourAssignments={};for(let h=0;h<24;h++)r.hourAssignments[h]='基本'}if(!r.hourAssignments)r.hourAssignments={};let first=Object.keys(r.patterns)[0]||'基本';for(let h=0;h<24;h++)if(!r.hourAssignments[h])r.hourAssignments[h]=first;if(!r.activePattern||!r.patterns[r.activePattern])r.activePattern=first}
function generatedTrains(r){ensurePatterns(r);let now=new Date(),out=[];for(let off=-1;off<=2;off++){let d=new Date(now);d.setMinutes(0,0,0);d.setHours(d.getHours()+off);let h=d.getHours(),pat=r.hourAssignments[h],arr=r.patterns[pat]||[];for(let t of arr){let raw=String(t.time||'').trim(),hh,mm;if(raw.includes(':')){[hh,mm]=raw.split(':').map(Number)}else{hh=h;mm=Number(raw)}if(!Number.isFinite(mm))continue;let dep=new Date(d);dep.setHours(hh,mm,0,0);if(!raw.includes(':'))dep.setHours(h,mm,0,0);let c=clone(t);c._dep=dep.getTime();c.time=String(dep.getHours()).padStart(2,'0')+':'+String(dep.getMinutes()).padStart(2,'0');out.push(c)}}return out.sort((a,b)=>a._dep-b._dep)}
function trainDelta(t){if(t._dep)return (t._dep-Date.now())/1000;return delta(t.time)}
function upcoming(r){let src=(r.patterns?generatedTrains(r):(r.trains||[]).map(x=>clone(x)));return src.sort((a,b)=>trainDelta(a)-trainDelta(b)).filter(t=>trainDelta(t)>-30)}function status(t){let d=trainDelta(t),s=data.settings;if(d<=s.departingSec&&d>=0)return'まもなく発車';if(d<=s.stoppedSec&&d>=0)return'停車中';if(d<=s.arrivalSec&&d>=0)return'まもなく到着';return''}function currentIndex(t){let st=t.stops||[],s=data.settings;if(!st.length)return-1;if(s.currentMode==='stations')return Math.max(0,st.length-1-s.currentStations);let d=Math.max(0,trainDelta(t));let mins=d/60;let back=Math.ceil(mins/Math.max(.1,s.currentMinutes));return Math.max(0,st.length-1-back)}function stopsHtml(t,showCurrent=true){let tp=route().types[t.type]||{bg:'#2680d9'},idx=currentIndex(t),phase=Math.floor(Date.now()/1000/data.settings.currentAlternateSec)%2;return`<div class="stops" style="--svc:${esc(tp.bg)}">${(t.stops||[]).map((x,i)=>`<span class="stop ${showCurrent&&phase&&i===idx?'current':''}">${esc(x)}</span>`).join('')}</div>`}function badge(t){let tp=route().types[t.type]||{ja:t.type,en:t.type,bg:'#555',fg:'#fff'};return`<span class="badge" style="background:${tp.bg};color:${tp.fg}">${esc(tp.ja)}</span>`}function noticeHtml(){return`<div class="notice"><span><b>【お知らせ】</b> ${esc(data.notices[0]||'')}</span></div>`}
function render(){let r=route();if(!r)return;let list=upcoming(r),mode=data.mode;if(mode==='concourse'){let rows=list.slice(0,6).map(t=>`<div class="train"><div class="time">${t.time}</div><div>${badge(t)}</div><div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div><div>${stopsHtml(t,true)}</div><div class="status">${status(t)}</div></div>`).join('');$('display').innerHTML=`<div class="concourse"><div class="panel"><div class="routeHead" style="--line:${r.lineColor}"><div class="code">${esc(r.code)}</div><div><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div></div></div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div><div>停車駅一覧</div><div>案内</div></div>${rows}${noticeHtml()}</div></div>`}else{let pl=data.selected.platform,fl=list.filter(t=>String(t.platform)===String(pl)).slice(0,3),cycle=Math.floor(Date.now()/1000),showStops=fl[0]&&cycle%(data.settings.platformStopEvery+8)<8,showNotice=cycle%data.settings.platformNoticeEvery<data.settings.platformNoticeDuration;let body='';fl.forEach((t,i)=>{if(i===1&&showStops&&fl[0])body+=`<div class="platformAlt">${stopsHtml(fl[0],true)}</div>`;else if(i===2&&showNotice)body+=`<div class="platformAlt">${noticeHtml()}</div>`;else body+=`<div class="train"><div class="time">${t.time}</div><div>${badge(t)}</div><div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div></div>`});if(fl[0]&&trainDelta(fl[0])<=data.settings.arrivalSec&&trainDelta(fl[0])>0)body+=`<div class="platformAlt arrival">まもなく電車がまいります　ご注意ください</div>`;$('display').innerHTML=`<div class="platform panel" style="--line:${r.lineColor}"><aside class="platformInfo"><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div><div class="platformNo">${esc(pl)}</div><div class="direction">${esc(r.direction)}</div><div class="sub">${esc(r.directionEn)}</div><div class="sub" style="margin-top:8px">直通先：${esc(r.through)}</div><div class="codes"><span class="miniCode">${esc(r.code)}</span></div></aside><section class="platformRight"><div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div></div>${body}</div></section></div>`}}
function stationOptions(d){return Object.keys(d.stations).map(x=>`<option ${x===d.selected.station?'selected':''}>${esc(x)}</option>`).join('')}function routeOptions(d){let s=d.stations[d.selected.station];return Object.keys(s.routes).map(x=>`<option ${x===d.selected.route?'selected':''}>${esc(x)}</option>`).join('')}function platformOptions(d){let r=route(d);return r.platforms.map(x=>`<option ${String(x)===String(d.selected.platform)?'selected':''}>${esc(x)}</option>`).join('')}
function settingsRender(){let d=draft,r=route(d),html='';if(tab==='select')html=`<div class="card"><h3>表示する駅・路線・番線</h3><div class="field"><label>駅</label><select id="selStation">${stationOptions(d)}</select></div><div class="field"><label>路線</label><select id="selRoute">${routeOptions(d)}</select></div><div class="field"><label>ホーム番線</label><select id="selPlatform">${platformOptions(d)}</select></div><button id="addStation">＋ 駅を追加</button> <button id="addRoute">＋ この駅に路線を追加</button><p class="hint">駅・路線を切り替えても、編集済みデータは消さずにすべて保存します。</p></div>`;
if(tab==='edit')html=`<div class="card"><h3>${esc(d.selected.station)} / ${esc(d.selected.route)}</h3><div class="two"><div class="field"><label>駅名</label><input id="stationName" value="${esc(d.selected.station)}"></div><div class="field"><label>駅ナンバリング</label><input id="stationCode" value="${esc(d.stations[d.selected.station].code||'')}"></div></div><div class="two"><div class="field"><label>路線名</label><input id="routeName" value="${esc(r.name)}"></div><div class="field"><label>英語路線名</label><input id="routeNameEn" value="${esc(r.nameEn)}"></div></div><div class="two"><div class="field"><label>路線ナンバリング</label><input id="routeCode" value="${esc(r.code)}"></div><div class="field"><label>路線カラー</label><input type="color" id="lineColor" value="${esc(r.lineColor)}"></div></div><div class="field"><label>方面</label><input id="direction" value="${esc(r.direction)}"></div><div class="field"><label>方面（英語）</label><input id="directionEn" value="${esc(r.directionEn)}"></div><div class="field"><label>直通先</label><input id="through" value="${esc(r.through)}"></div><div class="field"><label>番線（カンマ区切り）</label><input id="platforms" value="${esc(r.platforms.join(','))}"></div></div>`;
if(tab==='types')html=`<div class="card"><h3>種別テンプレート</h3>${Object.entries(r.types).map(([k,v],i)=>`<div class="three"><div class="field"><label>テンプレート名</label><input data-type="key" data-old="${esc(k)}" value="${esc(k)}"></div><div class="field"><label>表示名</label><input data-type="ja" data-old="${esc(k)}" value="${esc(v.ja)}"></div><div class="field"><label>英語</label><input data-type="en" data-old="${esc(k)}" value="${esc(v.en)}"></div><div class="field"><label>背景</label><input type="color" data-type="bg" data-old="${esc(k)}" value="${esc(v.bg)}"></div><div class="field"><label>文字</label><input type="color" data-type="fg" data-old="${esc(k)}" value="${esc(v.fg)}"></div></div><hr>`).join('')}<button id="addType">＋ 種別を追加</button></div>`;
if(tab==='timetable'){ensurePatterns(r);let pn=r.activePattern;let arr=r.patterns[pn]||[];html=`<div class="card"><h3>テキスト時刻表</h3><div class="field"><label>編集するパターン</label><select id="patternSelect">${Object.keys(r.patterns).map(x=>`<option ${x===pn?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>時刻（分だけでも可）|種別|当駅始発(1/0)|行先|英語行先|両数|番線|停車駅(,区切り)</label><textarea id="tt">${esc(arr.map(t=>[t.time,t.type,t.origin?1:0,t.dest,t.destEn,t.cars,t.platform,(t.stops||[]).join(',')].join('|')).join('\n'))}</textarea></div><button id="applyTT">このパターンに時刻表を反映</button><p class="hint">例：02|快速|0|島橋|Shimahashi|15|1|江川,しょみん,...　のように「分」だけ入力できます。表示時には、その時間帯の「時」を自動で付けます。</p></div>`}
if(tab==='patterns'){ensurePatterns(r);let names=Object.keys(r.patterns);html=`<div class="card"><h3>1時間サイクル・時間帯パターン</h3><div class="field"><label>パターン</label><select id="patManage">${names.map(x=>`<option ${x===r.activePattern?'selected':''}>${esc(x)}</option>`).join('')}</select></div><button id="addPattern">＋ パターン追加</button> <button class="danger" id="deletePattern">このパターンを削除</button><h3>何時台にどのパターンを使うか</h3><div class="hourGrid">${Array.from({length:24},(_,h)=>`<div class="hourCell"><b>${h}時</b><select data-hour="${h}">${names.map(x=>`<option ${x===r.hourAssignments[h]?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}</div><p class="hint">例：5〜9時＝朝、10〜15時＝昼、16〜19時＝夕方、20〜23時＝夜。時刻表タブで各パターンの内容を編集します。</p></div>`}
if(tab==='stops')html=`<div class="card"><h3>停車駅一覧・現在位置</h3><div class="two"><div class="field"><label>ホーム：停車駅一覧の表示間隔（秒）</label><input type="number" id="stopEvery" value="${d.settings.platformStopEvery}"></div><div class="field"><label>現在位置との交互切替（秒）</label><input type="number" id="altSec" value="${d.settings.currentAlternateSec}"></div></div><div class="field"><label>現在位置の推定方法</label><select id="currentMode"><option value="time" ${d.settings.currentMode==='time'?'selected':''}>発車まで何分かで推定</option><option value="stations" ${d.settings.currentMode==='stations'?'selected':''}>終点の何個前かで指定</option></select></div><div class="two"><div class="field"><label>何分前ごとに1駅進む</label><input type="number" step="0.5" id="currentMinutes" value="${d.settings.currentMinutes}"></div><div class="field"><label>終点の何個前</label><input type="number" id="currentStations" value="${d.settings.currentStations}"></div></div><div class="three"><div class="field"><label>まもなく到着（秒前）</label><input type="number" id="arrivalSec" value="${d.settings.arrivalSec}"></div><div class="field"><label>停車中（秒前）</label><input type="number" id="stoppedSec" value="${d.settings.stoppedSec}"></div><div class="field"><label>まもなく発車（秒前）</label><input type="number" id="departingSec" value="${d.settings.departingSec}"></div></div></div>`;
if(tab==='notice')html=`<div class="card"><h3>お知らせ</h3><div class="field"><label>表示文</label><textarea id="noticeText">${esc(d.notices.join('\n'))}</textarea></div><div class="two"><div class="field"><label>ホームで表示する周期（秒）</label><input type="number" id="noticeEvery" value="${d.settings.platformNoticeEvery}"></div><div class="field"><label>1回の表示時間（秒）</label><input type="number" id="noticeDuration" value="${d.settings.platformNoticeDuration}"></div></div><p class="hint">コンコースでは最下段に常時表示。ホームでは3段目と交互に表示します。両端は赤いグラデーションです。</p></div>`
if(tab==='backup')html=`<div class="card"><h3>バックアップ・復元</h3><p class="hint">駅・路線・番線・種別・時刻表・時間帯パターン・停車駅・お知らせをまとめて保存します。HTMLを更新する前にバックアップしておくと安全です。</p><button id="exportBackup">バックアップを書き出す</button> <button id="copyBackup">JSONをコピー</button><div class="field"><label>バックアップJSON</label><textarea id="backupJson" placeholder="ここにバックアップJSONを貼り付けて復元できます"></textarea></div><button id="restoreBackup">このJSONから復元</button><hr><button class="secondary" id="restoreAutosave">直前の自動保存から復元</button><p class="hint">保存日時：${esc(localStorage.getItem(KEY+'_savedAt')||'まだありません')}</p></div>`;
;$('settingsBody').innerHTML=html;wireSettings()}
function pullTab(){let d=draft,r=route(d);if(tab==='edit'&&$('routeName')){r.name=$('routeName').value;r.nameEn=$('routeNameEn').value;r.code=$('routeCode').value;r.lineColor=$('lineColor').value;r.direction=$('direction').value;r.directionEn=$('directionEn').value;r.through=$('through').value;r.platforms=$('platforms').value.split(',').map(x=>x.trim()).filter(Boolean);d.stations[d.selected.station].code=$('stationCode').value;let nn=$('stationName').value.trim();if(nn&&nn!==d.selected.station){d.stations[nn]=d.stations[d.selected.station];delete d.stations[d.selected.station];d.selected.station=nn}}if(tab==='types'){let nt={};document.querySelectorAll('[data-type="key"]').forEach(inp=>{let old=inp.dataset.old,key=inp.value||old,v=r.types[old];nt[key]={ja:document.querySelector(`[data-type="ja"][data-old="${CSS.escape(old)}"]`).value,en:document.querySelector(`[data-type="en"][data-old="${CSS.escape(old)}"]`).value,bg:document.querySelector(`[data-type="bg"][data-old="${CSS.escape(old)}"]`).value,fg:document.querySelector(`[data-type="fg"][data-old="${CSS.escape(old)}"]`).value};r.trains.forEach(t=>{if(t.type===old)t.type=key})});r.types=nt}if(tab==='stops'&&$('stopEvery')){d.settings.platformStopEvery=+$('stopEvery').value||12;d.settings.currentAlternateSec=+$('altSec').value||5;d.settings.currentMode=$('currentMode').value;d.settings.currentMinutes=+$('currentMinutes').value||3;d.settings.currentStations=+$('currentStations').value||2;d.settings.arrivalSec=+$('arrivalSec').value||105;d.settings.stoppedSec=+$('stoppedSec').value||50;d.settings.departingSec=+$('departingSec').value||15}if(tab==='notice'&&$('noticeText')){d.notices=$('noticeText').value.split('\n').filter(Boolean);d.settings.platformNoticeEvery=+$('noticeEvery').value||30;d.settings.platformNoticeDuration=+$('noticeDuration').value||8}}
function wireSettings(){if($('selStation'))$('selStation').onchange=e=>{draft.selected.station=e.target.value;draft.selected.route=Object.keys(draft.stations[e.target.value].routes)[0];draft.selected.platform=route(draft).platforms[0];settingsRender()};if($('selRoute'))$('selRoute').onchange=e=>{draft.selected.route=e.target.value;draft.selected.platform=route(draft).platforms[0];settingsRender()};if($('selPlatform'))$('selPlatform').onchange=e=>draft.selected.platform=e.target.value;if($('addStation'))$('addStation').onclick=()=>{let n=prompt('新しい駅名');if(!n||draft.stations[n])return;draft.stations[n]={code:'XX',routes:{'新路線':clone(route(draft))}};draft.selected={station:n,route:'新路線',platform:draft.stations[n].routes['新路線'].platforms[0]};settingsRender()};if($('addRoute'))$('addRoute').onclick=()=>{let n=prompt('新しい路線名');if(!n||draft.stations[draft.selected.station].routes[n])return;draft.stations[draft.selected.station].routes[n]=clone(route(draft));draft.selected.route=n;settingsRender()};if($('addType'))$('addType').onclick=()=>{pullTab();route(draft).types['新種別'+(Object.keys(route(draft).types).length+1)]={ja:'新種別',en:'Service',bg:'#176bc1',fg:'#fff'};settingsRender()};if($('patternSelect'))$('patternSelect').onchange=e=>{let r=route(draft);ensurePatterns(r);r.activePattern=e.target.value;settingsRender()};if($('applyTT'))$('applyTT').onclick=()=>{let r=route(draft);ensurePatterns(r);let pn=r.activePattern;r.patterns[pn]=$('tt').value.split(/\n+/).map(line=>{let p=line.split('|');if(p.length<7)return null;let tm=p[0].trim();if(!/^([01]?\d|2[0-3]):[0-5]\d$/.test(tm)&&!/^\d{1,2}$/.test(tm))return null;return{time:tm,type:p[1].trim(),origin:p[2].trim()==='1',dest:p[3].trim(),destEn:p[4].trim(),cars:p[5].trim(),platform:p[6].trim(),stops:(p[7]||'').split(',').map(x=>x.trim()).filter(Boolean)}}).filter(Boolean).sort((a,b)=>{let am=Number(String(a.time).split(':').pop()),bm=Number(String(b.time).split(':').pop());return am-bm});r.trains=clone(r.patterns[pn]);alert('時刻表を「'+pn+'」に反映しました');settingsRender()};if($('patManage'))$('patManage').onchange=e=>{route(draft).activePattern=e.target.value};document.querySelectorAll('[data-hour]').forEach(x=>x.onchange=e=>{let r=route(draft);ensurePatterns(r);r.hourAssignments[e.target.dataset.hour]=e.target.value});if($('addPattern'))$('addPattern').onclick=()=>{let r=route(draft);ensurePatterns(r);let n=prompt('新しいパターン名（例：朝、昼、夕方）');if(!n||r.patterns[n])return;r.patterns[n]=clone(r.patterns[r.activePattern]||[]);r.activePattern=n;settingsRender()};if($('deletePattern'))$('deletePattern').onclick=()=>{let r=route(draft);ensurePatterns(r);let names=Object.keys(r.patterns);if(names.length<=1){alert('パターンは最低1つ必要です');return}let del=r.activePattern;if(!confirm('「'+del+'」を削除しますか？'))return;delete r.patterns[del];let first=Object.keys(r.patterns)[0];for(let h=0;h<24;h++)if(r.hourAssignments[h]===del)r.hourAssignments[h]=first;r.activePattern=first;settingsRender()};if($('exportBackup'))$('exportBackup').onclick=()=>{pullTab();const payload=JSON.stringify(draft,null,2);const blob=new Blob([payload],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fictional-railway-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('copyBackup'))$('copyBackup').onclick=async()=>{pullTab();const payload=JSON.stringify(draft,null,2);$('backupJson').value=payload;try{await navigator.clipboard.writeText(payload);alert('バックアップJSONをコピーしました')}catch(e){alert('下の欄にJSONを表示しました。長押しでコピーしてください')}};if($('restoreBackup'))$('restoreBackup').onclick=()=>{const x=normalizeData(safeParse($('backupJson').value));if(!x){alert('バックアップJSONを読み取れませんでした');return}if(!confirm('現在の編集内容をバックアップの内容に置き換えますか？'))return;draft=clone(x);settingsRender();alert('読み込みました。「保存して戻る」を押すと確定します')};if($('restoreAutosave'))$('restoreAutosave').onclick=()=>{const x=normalizeData(safeParse(localStorage.getItem(KEY+'_autosave')));if(!x){alert('自動保存データがありません');return}draft=clone(x);settingsRender();alert('自動保存を読み込みました。「保存して戻る」を押すと確定します')}}
$('settingsBtn').onclick=()=>{draft=clone(data);tab='select';settingsRender();$('settings').classList.add('open')};$('cancelBtn').onclick=()=>$('settings').classList.remove('open');$('saveBtn').onclick=()=>{pullTab();data=draft;persist();render();$('settings').classList.remove('open')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{pullTab();tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary');settingsRender()});$('modeBtn').onclick=()=>{data.mode=data.mode==='platform'?'concourse':'platform';persist();render()};let lastRenderKey='';function refresh(){let n=new Date();$('clock').textContent=n.toLocaleTimeString('ja-JP',{hour12:false});let r=route();if(!r)return;let u=upcoming(r),first=u[0];let key=[data.mode,data.selected.station,data.selected.route,data.selected.platform,first?first.time:'',first?status(first):'',Math.floor(Date.now()/1000/Math.max(1,data.settings.currentAlternateSec)),data.mode==='platform'?Math.floor(Date.now()/1000/Math.max(1,data.settings.platformStopEvery)):0,data.mode==='platform'?Math.floor(Date.now()/1000/Math.max(1,data.settings.platformNoticeEvery)):0].join('|');if(key!==lastRenderKey){lastRenderKey=key;render()}}setInterval(refresh,1000);refresh();
</script></body></html>
