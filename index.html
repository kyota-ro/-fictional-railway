function parseTimetable(txt){return String(txt||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{let a=line.split('|');return {time:(a[0]||'').trim(),type:(a[1]||'').trim(),origin:String(a[2]||'0').trim()==='1',dest:(a[3]||'').trim(),destEn:(a[4]||'').trim(),cars:(a[5]||'').trim(),platform:(a[6]||'').trim(),stops:(a[7]||'').split(',').map(x=>x.trim()).filter(Boolean),through:(a[8]||'').trim()}})}

 else if(tab==='patterns'&&$('patternNames')){ensurePatterns(r);let names=$('patternNames').value.split(',').map(x=>x.trim()).filter(Boolean);let np={};names.forEach(n=>np[n]=r.patterns[n]||[]);if(!names.length){names=['基本'];np['基本']=[]}r.patterns=np;document.querySelectorAll('[data-hour]').forEach(x=>r.hourAssignments[x.dataset.hour]=names.includes(x.value)?x.value:names[0]);r.activePattern=names.includes(r.activePattern)?r.activePattern:names[0]}

  let n=new Date();$('clock').textContent=n.toLocaleTimeString('ja-JP',{hour12:false});
  let r=route();if(!r)return;
  let u=upcoming(r),first=u[0],nowSec=Math.floor(Date.now()/1000),keyParts=[data.mode,data.selected.station,data.selected.route,data.selected.platform];
  if(data.mode==='platform'){
    let pl=data.selected.platform,fl=u.filter(t=>String(t.platform)===String(pl)).slice(0,3),f=fl[0];
    let stopEvery=Math.max(1,data.settings.platformStopEvery),noticeEvery=Math.max(1,data.settings.platformNoticeEvery),noticeDur=Math.max(0,data.settings.platformNoticeDuration);
    let showPosition=!!f && nowSec%(stopEvery+8)<8;
    let showNotice=nowSec%noticeEvery<noticeDur;

    keyParts.push(...fl.map(t=>t?[t.time,t.type,t.dest,t.cars,t.platform,t.origin?1:0,t.through||''].join('~'):'-'));

<script>
(()=>{
  const viewport=document.getElementById('display');
  if(!viewport) return;

  let stage=null, board=null, gesture=null, installQueued=false;
  const state={scale:1, scrollLeft:0, scrollTop:0, initialized:false, manual:false};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const directSelector=':scope > .platform, :scope > .concourse';

  function vsize(){ const r=viewport.getBoundingClientRect(); return {w:Math.max(1,r.width),h:Math.max(1,r.height)}; }
  function nsize(){
    if(!board) return {w:1180,h:500};
    return {w:Math.max(1,board.offsetWidth||1180), h:Math.max(1,board.offsetHeight||board.scrollHeight||500)};
  }
  function fitScale(){
    const v=vsize(), n=nsize();
    return clamp(Math.min((v.w-8)/n.w,(v.h-8)/n.h,1),0.08,1);
  }
  function updateStage(){
    if(!stage||!board) return;
    const n=nsize();
    stage.style.width=(n.w*state.scale)+'px';
    stage.style.height=(n.h*state.scale)+'px';
    board.style.setProperty('--board-scale',String(state.scale));
  }
  function restoreScroll(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      viewport.scrollLeft=state.scrollLeft;
      viewport.scrollTop=state.scrollTop;
    }));
  }
  function setScale(next,anchor){
    if(!board||!stage) return;
    const old=state.scale;
    const min=Math.min(fitScale(),0.12);
    const ns=clamp(next,min,3.5);
    let contentX=0,contentY=0;
    if(anchor){
      contentX=(viewport.scrollLeft+anchor.x)/Math.max(old,0.001);
      contentY=(viewport.scrollTop+anchor.y)/Math.max(old,0.001);
    }
    state.scale=ns; state.manual=true;
    updateStage();
    if(anchor){
      viewport.scrollLeft=Math.max(0,contentX*ns-anchor.x);
      viewport.scrollTop=Math.max(0,contentY*ns-anchor.y);
      state.scrollLeft=viewport.scrollLeft; state.scrollTop=viewport.scrollTop;
    }
  }
  function fitOnce(){
    if(!board) return;
    state.scale=fitScale();
    state.scrollLeft=0; state.scrollTop=0;

      stage=document.createElement('div');
      stage.className='boardZoomStage';
      viewport.insertBefore(stage,direct);
      stage.appendChild(direct);
      board=direct;
      board.classList.add('zoomableDepartureBoard');
      if(!state.initialized) requestAnimationFrame(fitOnce);
      else { requestAnimationFrame(()=>{ updateStage(); restoreScroll(); }); }
      return;
    }
    const ex=viewport.querySelector(':scope > .boardZoomStage');
    if(ex){
      stage=ex; board=ex.querySelector(':scope > .platform, :scope > .concourse');
      if(board){ board.classList.add('zoomableDepartureBoard'); updateStage(); restoreScroll(); }
    }
  }
  function queueInstall(){ if(installQueued) return; installQueued=true; installBoard(); }

  // Remember pan continuously, so a scheduled render cannot snap the board back to 0,0.
  viewport.addEventListener('scroll',()=>{
    state.scrollLeft=viewport.scrollLeft; state.scrollTop=viewport.scrollTop;
  },{passive:true});

  new MutationObserver(muts=>{
    if(muts.some(m=>m.type==='childList')) queueInstall();
  }).observe(viewport,{childList:true});
  installBoard();

  const distance=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const midpoint=(a,b)=>{ const r=viewport.getBoundingClientRect(); return {x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top}; };

  viewport.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const a=e.touches[0],b=e.touches[1];
      gesture={type:'pinch',startDist:Math.max(1,distance(a,b)),startScale:state.scale};
    }else if(e.touches.length===1){
      const t=e.touches[0];
      gesture={type:'pan',x:t.clientX,y:t.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};
    }
  },{passive:false});
  viewport.addEventListener('touchmove',e=>{
    if(!gesture) return;
    if(e.touches.length===2){
      e.preventDefault();
      const a=e.touches[0],b=e.touches[1];
      if(gesture.type!=='pinch') gesture={type:'pinch',startDist:Math.max(1,distance(a,b)),startScale:state.scale};
      const ratio=distance(a,b)/gesture.startDist;
      setScale(gesture.startScale*ratio,midpoint(a,b));
    }else if(e.touches.length===1 && gesture.type==='pan'){
      e.preventDefault();
      const t=e.touches[0];
      viewport.scrollLeft=gesture.left-(t.clientX-gesture.x);
      viewport.scrollTop=gesture.top-(t.clientY-gesture.y);
      state.scrollLeft=viewport.scrollLeft; state.scrollTop=viewport.scrollTop;
    }
  },{passive:false});
  viewport.addEventListener('touchend',e=>{
    if(e.touches.length===0) gesture=null;
    else if(e.touches.length===1){
      const t=e.touches[0];
      gesture={type:'pan',x:t.clientX,y:t.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};
    }
  },{passive:false});
  viewport.addEventListener('touchcancel',()=>gesture=null,{passive:true});

  // Rotation/resize keeps the current user zoom and pan. It never auto-resets after initialization.
  addEventListener('resize',()=>{ if(board){ updateStage(); restoreScroll(); } });
  addEventListener('orientationchange',()=>setTimeout(()=>{ if(board){ updateStage(); restoreScroll(); } },180));

  // Marquee progress is keyed by text, not DOM nodes, so re-rendering doesn't restart it.
  const marqueeByText=new Map();
  let last=performance.now(); const SPEED=48, GAP=100;
  function tick(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    document.querySelectorAll('.noticeWindow .noticeTrack').forEach(track=>{
      const win=track.parentElement; if(!win) return;
      const ww=win.clientWidth,tw=track.scrollWidth; if(!ww||!tw) return;
      const key=track.textContent||'';
      let x=marqueeByText.has(key)?marqueeByText.get(key):ww;
      x-=SPEED*dt;
      if(x<=-tw-GAP) x=ww;
      marqueeByText.set(key,x);
      track.style.transform=`translate3d(${x}px,-50%,0)`;
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<script id="v30BetweenPositionFixLogic">
(function(){
  'use strict';
  if(typeof timingForStation!=='function' || typeof trainDepartureMs!=='function') return;

  function keyName(v){return String(v??'').trim().replace(/[\s　]+/g,'').replace(/駅$/,'')}

  /* Resolve the physical approach to the selected station from each station's
     configured arrival/departure offset.  After a station's departure instant,
     the state is explicitly "between" until the next station's arrival. */
  selectedStationApproachState=function(t){
    const r=route();
    const all=Array.isArray(r?.stops)?r.stops:[];
    const selected=(typeof selectedStationName==='function')?selectedStationName(r):(data?.selected?.station||'');
    const sel=all.findIndex(x=>keyName(x)===keyName(selected));
    if(sel<0||!all.length)return null;

    const depMs=trainDepartureMs(t), now=Date.now();
    const start=Math.max(0,sel-3);
    const events=[];
    for(let i=start;i<=sel;i++){
      const tm=timingForStation(r,all[i]);
      let arr=depMs-Math.max(0,Number(tm.arrivalBefore)||0)*1000;
      let leave=depMs-Math.max(0,Number(tm.departureBefore)||0)*1000;
      /* A station cannot depart before it arrives. If malformed input is supplied,
         clamp departure to arrival instead of leaving the UI stuck at that station. */
      if(leave<arr) leave=arr;
      events.push({idx:i,arr,leave});
    }

    if(now<events[0].arr){
      return {all,selectedIdx:sel,currentIdx:start,visible:false,atSelected:false,betweenAfter:null,state:'before'};
    }

    for(let k=0;k<events.length;k++){
      const e=events[k];
      if(now>=e.arr && now<e.leave){
        return {all,selectedIdx:sel,currentIdx:e.idx,visible:true,atSelected:e.idx===sel,betweenAfter:null,state:'station'};
      }
      if(k<events.length-1){
        const nx=events[k+1];
        /* This is the requested rule: once the previous station departure time
           has passed, show the train between that station and the next one. */
        if(now>=e.leave && now<nx.arr){
          return {all,selectedIdx:sel,currentIdx:e.idx+0.5,visible:true,atSelected:false,betweenAfter:e.idx,state:'between'};
        }
      }
    }

    const last=events[events.length-1];
    if(now>=last.arr){
      return {all,selectedIdx:sel,currentIdx:sel,visible:true,atSelected:true,betweenAfter:null,state:'selected'};
    }
    return {all,selectedIdx:sel,currentIdx:start,visible:true,atSelected:false,betweenAfter:null,state:'station'};
  };

  approachPositionHtml=function(t){
    const p=selectedStationApproachState(t);
    if(!p||!p.visible)return `<div class="positionApproach"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram"><span style="color:#9aa4ad">接近前</span></div></div>`;

    const start=Math.max(0,p.selectedIdx-3);
    const view=p.all.slice(start,p.selectedIdx+1);
    const n=Math.max(1,view.length);
    const stationIdx=Number.isInteger(p.currentIdx)?p.currentIdx:-1;
    let between='';
    if(Number.isInteger(p.betweenAfter) && n>1){
      const rel=p.betweenAfter-start;
      if(rel>=0 && rel<n-1){
        /* Station centres are evenly spaced; the moving marker is the midpoint
           between the two relevant centres. */
        const pct=((rel+0.5)/(n-1))*100;
        between=`<div class="approachBetweenLayerV30"><span class="approachBetweenMarkerV30" style="left:${pct.toFixed(3)}%"></span></div>`;
      }
    }

    return `<div class="positionApproach" style="--line:${esc(route().lineColor||'#2680d9')}"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram">${view.map((name,j)=>{const real=start+j;return `<span class="approachStop ${real===stationIdx?'current':''}"><span class="approachStopName">${esc(name)}</span></span>`}).join('')}${between}</div></div>`;
  };

  /* The old 1-second refresh key used currentIndex(), which does not know the
     station-timing "between" state. Add the real approach state to the key so the
     screen updates exactly when a departure/arrival boundary is crossed. */
  let v30Last='';
  setInterval(function(){
    try{
      if(data.mode!=='platform')return;
      const r=route(); if(!r)return;
      const f=upcoming(r).filter(t=>String(t.platform)===String(data.selected.platform))[0];
      const p=f?selectedStationApproachState(f):null;
      const k=f ? [f.time,p?.state,p?.currentIdx,p?.betweenAfter,platformPhase(f)].join('|') : '-';
      if(k!==v30Last){
        v30Last=k;
        if(typeof lastRenderKey!=='undefined')lastRenderKey='';
        render();
      }
    }catch(e){}
  },250);

  try{ if(typeof lastRenderKey!=='undefined')lastRenderKey=''; render(); }catch(e){}
})();
</script>

 ];

<script>
/* Current train position: show where the train is BEFORE the currently selected station.
   The approach starts three stations before the selected station. */
function selectedStationApproachState(t){
  const r=route();
  const all=(r&&Array.isArray(r.stops))?r.stops:[];
  const stationName=data.selected.station;
  let selectedIdx=all.indexOf(stationName);

  /* Fallback for older data where the station list was not filled in. */
  if(selectedIdx<0){
    const ts=Array.isArray(t.stops)?t.stops:[];
    const first=ts[0];
    if(first){
      selectedIdx=all.indexOf(first);
    }
  }
  if(selectedIdx<0 || !all.length) return null;

  /* currentMinutes means the estimated running time per station.
     We only expose the position once the train is within three stations. */
  const secPerStation=Math.max(6, Number(data.settings.currentMinutes||1)*60);
  const remain=Math.max(0, trainDelta(t));
  const stationsBefore=Math.min(3, Math.max(0, Math.ceil(remain/secPerStation)));
  const currentIdx=Math.max(0, selectedIdx-stationsBefore);
  const visible=remain <= secPerStation*3;
  return {all,selectedIdx,currentIdx,visible};
}

/* Override the old destination-based approach diagram. */
approachPositionHtml=function(t){
  const p=selectedStationApproachState(t);
  if(!p || !p.visible){
    return `<div class="positionApproach"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram"><span style="color:#9aa4ad">接近前</span></div></div>`;
  }
  const start=Math.max(0,p.selectedIdx-3);
  const view=p.all.slice(start,p.selectedIdx+1);
  return `<div class="positionApproach" style="--line:${esc(route().lineColor||'#2680d9')}"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram">${view.map((name,j)=>{
    const real=start+j;
    const cls=real===p.currentIdx?'current':'';
    return `<span class="approachStop ${cls}"><span class="approachStopName">${esc(name)}</span></span>`;
  }).join('')}</div></div>`;
};

/* Make the periodic position row appear only when the next train is within
   three stations of the selected station. The rest of render() remains intact. */
const __railwayRenderVCurrent=render;
render=function(){
  __railwayRenderVCurrent();
  if(data.mode!=='platform') return;
  const r=route(); if(!r) return;
  const pl=data.selected.platform;
  const fl=upcoming(r).filter(t=>String(t.platform)===String(pl)).slice(0,3);
  if(!fl[0]) return;
  const p=selectedStationApproachState(fl[0]);
  const pos=document.querySelector('.positionApproach');
  if(pos && (!p || !p.visible)){
    /* If the old periodic cycle requested a position row while the train is
       still farther than three stations away, restore the normal 3-train rows. */
    const host=document.querySelector('.platformRight>div');
    if(host){
      const row=(t)=>`<div class="train"><div class="time">${t.time}</div>${serviceHtml(t)}<div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div></div>`;
      const head=host.querySelector('.head')?.outerHTML||'';
      const strip=host.querySelector('.platformNoticeStrip')?.outerHTML||'<div class="platformNoticeStrip"></div>';
      host.innerHTML=head+fl.slice(0,3).map(row).join('')+strip;
    }
  }
};

<script id="v28TimingLogic">
(function(){
  'use strict';

  const pad2=n=>String(Math.max(0,Math.floor(n))).padStart(2,'0');
  function offsetToText(sec){
    sec=Math.max(0,Math.round(Number(sec)||0));
    return pad2(Math.floor(sec/60))+':'+pad2(sec%60);
  }
  function textToOffset(v){
    v=String(v??'').trim();
    if(!v)return null;
    if(/^\d+(?:\.\d+)?$/.test(v))return Math.max(0,Math.round(Number(v)));
    const p=v.split(':').map(Number);
    if(p.length===2&&p.every(Number.isFinite))return Math.max(0,Math.round(p[0]*60+p[1]));
    return null;
  }
  function ensureStationTiming(r){
    if(!r)return {};
    if(!r.stationTiming||typeof r.stationTiming!=='object'||Array.isArray(r.stationTiming))r.stationTiming={};
    return r.stationTiming;
  }
  function stationNameKey(v){return String(v??'').trim().replace(/[\s　]+/g,'').replace(/[（(［\[].*?[）)］\]]/g,'').replace(/駅$/,'')}
  function selectedStationName(r=route()){
    const raw=data?.selected?.station||'';
    const all=Array.isArray(r?.stops)?r.stops:[];
    const key=stationNameKey(raw);
    return all.find(x=>stationNameKey(x)===key)||String(raw).trim().replace(/駅$/,'');
  }
  function defaultArrivalBefore(){
    /* Preserve the former 50-second stopped window as the migration default. */
    return Math.max(1,Number(data?.settings?.stoppedSec)||50);
  }
  function timingForStation(r,name){
    const map=ensureStationTiming(r);
    const wanted=stationNameKey(name);
    const mapKey=Object.keys(map).find(k=>stationNameKey(k)===wanted);
    const x=mapKey?map[mapKey]:map[name];
    if(x&&Number.isFinite(Number(x.arrivalBefore))&&Number.isFinite(Number(x.departureBefore))){
      return {arrivalBefore:Math.max(0,Number(x.arrivalBefore)),departureBefore:Math.max(0,Number(x.departureBefore))};
    }
    const all=Array.isArray(r?.stops)?r.stops:[];
    const selected=selectedStationName(r);
    const sel=all.findIndex(x=>stationNameKey(x)===stationNameKey(selected));
    const idx=all.findIndex(x=>stationNameKey(x)===wanted);
    if(sel>=0&&idx>=0&&idx<=sel){
      const secPer=Math.max(20,(Number(data?.settings?.currentMinutes)||3)*60);
      const dwell=Math.min(30,Math.max(10,secPer*.12));
      if(idx===sel)return {arrivalBefore:defaultArrivalBefore(),departureBefore:0};
      const distance=sel-idx;
      const depBefore=defaultArrivalBefore()+distance*secPer;
      return {arrivalBefore:depBefore+dwell,departureBefore:depBefore};
    }
    return {arrivalBefore:0,departureBefore:0};
  }
  function trainDepartureMs(t){
    if(Number.isFinite(Number(t?._dep)))return Number(t._dep);
    const now=new Date(),raw=String(t?.time||'').trim();
    let hh=now.getHours(),mm=0;
    if(raw.includes(':')){const a=raw.split(':').map(Number);hh=a[0];mm=a[1]}else mm=Number(raw);
    if(!Number.isFinite(hh)||!Number.isFinite(mm))return Date.now()+86400000;
    const d=new Date(now);d.setHours(hh,mm,0,0);
    if(d.getTime()<Date.now()-43200000)d.setDate(d.getDate()+1);
    if(d.getTime()>Date.now()+43200000)d.setDate(d.getDate()-1);
    return d.getTime();
  }
  function trainTimingState(t,r=route()){
    const depMs=trainDepartureMs(t),now=Date.now(),sel=selectedStationName();
    const self=timingForStation(r,sel);
    const arrMs=depMs-self.arrivalBefore*1000;
    return {depMs,arrMs,depDelta:(depMs-now)/1000,arrivalDelta:(arrMs-now)/1000,arrivalBefore:self.arrivalBefore};
  }
  window.__trainTimingState=trainTimingState;

  /* At the scheduled departure instant the train is no longer listed. */
  upcoming=function(r){
    const src=(r.patterns?generatedTrains(r):(r.trains||[]).map(x=>clone(x)));
    return src.sort((a,b)=>trainDelta(a)-trainDelta(b)).filter(t=>trainDelta(t)>0);
  };

  /* Concourse status is based on the configured arrival time, not an arbitrary
     number of seconds before departure. Between arrival and departure it is stopped. */
  status=function(t){
    const x=trainTimingState(t),s=data.settings||{};
    if(x.depDelta<=0)return '';
    if(x.arrivalDelta<=0)return '停車中';
    if(x.arrivalDelta<=Math.max(1,Number(s.arrivalSec)||105))return 'まもなく到着';
    return '';
  };

  /* Work out the next train's approach from station-specific arrival/departure offsets.
     Only the selected station and its preceding three stations are used on the platform. */
  selectedStationApproachState=function(t){
    const r=route(),all=Array.isArray(r?.stops)?r.stops:[];
    const selected=selectedStationName(r);
    const sel=all.findIndex(x=>stationNameKey(x)===stationNameKey(selected));
    if(sel<0||!all.length)return null;

    const depMs=trainDepartureMs(t),now=Date.now(),start=Math.max(0,sel-3);
    const events=[];
    for(let i=start;i<=sel;i++){
      const tm=timingForStation(r,all[i]);
      let arr=depMs-Math.max(0,Number(tm.arrivalBefore)||0)*1000;
      let leave=depMs-Math.max(0,Number(tm.departureBefore)||0)*1000;
      /* In the "seconds before departure" system, arrivalBefore must be
         greater than or equal to departureBefore.  If a malformed row is
         entered, keep the station dwell non-negative instead of trapping the
         position marker at the previous station. */
      if(leave<arr) leave=arr;
      events.push({idx:i,arr,leave,name:all[i]});
    }

    if(now<events[0].arr){
      return {all,selectedIdx:sel,currentIdx:start,visible:false,atSelected:false,state:'before',betweenAfter:null,progress:0};
    }

    for(let k=0;k<events.length;k++){
      const e=events[k];
      if(now>=e.arr && now<e.leave){
        return {all,selectedIdx:sel,currentIdx:e.idx,visible:true,atSelected:e.idx===sel,state:'station',betweenAfter:null,progress:0};
      }
      if(k<events.length-1){
        const nx=events[k+1];
        if(now>=e.leave && now<nx.arr){
          const span=Math.max(1,nx.arr-e.leave);
          const progress=Math.max(0,Math.min(1,(now-e.leave)/span));
          return {all,selectedIdx:sel,currentIdx:e.idx+progress,visible:true,atSelected:false,state:'between',betweenAfter:e.idx,progress};
        }
      }
    }

    const last=events[events.length-1];
    if(now>=last.arr){
      return {all,selectedIdx:sel,currentIdx:sel,visible:true,atSelected:true,state:'selected',betweenAfter:null,progress:1};
    }
    return {all,selectedIdx:sel,currentIdx:start,visible:true,atSelected:false,state:'station',betweenAfter:null,progress:0};
  };

  approachPositionHtml=function(t){
    const p=selectedStationApproachState(t);
    if(!p||!p.visible)return `<div class="positionApproach"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram"><span style="color:#9aa4ad">接近前</span></div></div>`;

    const start=Math.max(0,p.selectedIdx-3),view=p.all.slice(start,p.selectedIdx+1);
    const n=Math.max(1,view.length);
    const stationIdx=Number.isInteger(p.currentIdx)?p.currentIdx:-1;
    let between='';
    if(p.state==='between' && Number.isInteger(p.betweenAfter) && n>1){
      const rel=p.betweenAfter-start;
      if(rel>=0 && rel<n-1){
        const pct=((rel+Math.max(0,Math.min(1,Number(p.progress)||0)))/(n-1))*100;
        between=`<div class="approachBetweenLayerV31"><span class="approachBetweenMarkerV31" style="left:${pct.toFixed(3)}%"></span></div>`;
      }
    }
    return `<div class="positionApproach" style="--line:${esc(route().lineColor||'#2680d9')}"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram">${view.map((name,j)=>{const real=start+j;return `<span class="approachStop ${real===stationIdx?'current':''}"><span class="approachStopName">${esc(name)}</span></span>`}).join('')}${between}</div></div>`;
  };

  function platformPhase(t){
    if(!t)return 'none';
    const x=trainTimingState(t),start=Math.max(1,Number(data.settings.arrivalSec)||105);
    if(x.depDelta<=0)return 'departed';
    /* From 20 seconds before arrival through departure, show stop information. */
    if(x.arrivalDelta<=20)return 'stops';
    if(x.arrivalDelta<=start)return 'approach';
    return 'normal';
  }
  function stopMessage(t){
    const st=Array.isArray(t?.stops)?t.stops:[];
    const selected=selectedStationName(route());
    let i=st.findIndex(x=>stationNameKey(x)===stationNameKey(selected)),later=i>=0?st.slice(i+1):st.slice(1);
    if(!later.length)later=st.filter(x=>x!==selected);
    return `この電車は${later.length?later.join('、'):'各駅'}に止まります。`;
  }

  /* Final board renderer. It keeps all established layout/zoom code untouched and
     changes only timetable state/strip behavior. */
  render=function(){
    const r=route();if(!r)return;
    const list=upcoming(r),mode=data.mode;
    if(mode==='concourse'){
      const rows=list.slice(0,6).map(t=>`<div class="train"><div class="time">${t.time}</div>${serviceHtml(t)}<div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div><div>${stopsHtml(t,false)}</div><div class="status">${status(t)}</div></div>`).join('');
      $('display').innerHTML=`<div class="concourse"><div class="panel"><div class="routeHead" style="--line:${r.lineColor}"><div class="code">${esc(r.code)}</div><div><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div></div></div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div><div>停車駅一覧</div><div>案内</div></div>${rows}${noticeHtml()}</div></div>`;
    }else{
      const pl=data.selected.platform,fl=list.filter(t=>String(t.platform)===String(pl)).slice(0,3),first=fl[0];
      const nowSec=Math.floor(Date.now()/1000),stopEvery=Math.max(1,Number(data.settings.platformStopEvery)||12);
      const p=first?selectedStationApproachState(first):null;
      const showPosition=!!first&&!!p?.visible&&nowSec%(stopEvery+8)<8;
      const row=t=>`<div class="train"><div class="time">${t.time}</div>${serviceHtml(t)}<div class="origin">${t.origin?'当駅始発':''}</div><div class="dest">${esc(t.dest)}<small>${esc(t.destEn)}</small></div><div class="meta">${esc(t.cars)}両</div><div class="meta">${esc(t.platform)}番線</div></div>`;
      let body='';
      if(showPosition&&first){body+=row(first);body+=approachPositionHtml(first);body+=fl[1]?row(fl[1]):`<div class="train"></div>`}
      else for(let i=0;i<3;i++)body+=fl[i]?row(fl[i]):`<div class="train"></div>`;

      let strip=`<div class="platformNoticeStrip"></div>`;
      if(first){
        const phase=platformPhase(first);
        if(phase==='approach')strip=`<div class="platformNoticeStrip arrival">まもなく電車がまいります</div>`;
        else if(phase==='stops')strip=`<div class="platformNoticeStrip">${noticeHtml(stopMessage(first),'【停車駅】')}</div>`;
        else {
          const noticeEvery=Math.max(1,Number(data.settings.platformNoticeEvery)||30),noticeDur=Math.max(0,Number(data.settings.platformNoticeDuration)||8);
          if(nowSec%noticeEvery<noticeDur)strip=`<div class="platformNoticeStrip">${noticeHtml()}</div>`;
        }
      }
      $('display').innerHTML=`<div class="platform panel" style="--line:${r.lineColor}"><aside class="platformInfo"><div class="routeName">${esc(r.name)}</div><div class="sub">${esc(r.nameEn)}</div><div class="platformNo">${esc(pl)}</div><div class="direction">${esc(r.direction)}</div><div class="sub">${esc(r.directionEn)}</div><div class="sub through" style="margin-top:5px">直通先：${esc(r.through)}</div><div class="codes"><span class="miniCode">${esc(r.code)}</span></div></aside><section class="platformRight"><div><div class="head"><div>時刻</div><div>種別</div><div>始発</div><div>行き先</div><div>両数</div><div>番線</div></div>${body}${strip}</div></section></div>`;
    }
    /* Reapply the existing persisted viewport transform without resetting it. */
    if(typeof window.__applyBoardTransform==='function')requestAnimationFrame(()=>window.__applyBoardTransform());
  };

  /* Add station timing controls to the existing Stop/Position settings tab without
     replacing or removing any of the established controls. */
  const oldSettingsRender=settingsRender;
  settingsRender=function(){
    oldSettingsRender();
    if(tab!=='stops'||!draft)return;
    const r=route(draft),body=$('settingsBody');if(!r||!body)return;
    const map=ensureStationTiming(r),all=Array.isArray(r.stops)?r.stops:[];
    const rawSel=draft.selected.station,sel=all.find(x=>stationNameKey(x)===stationNameKey(rawSel))||String(rawSel||'').replace(/駅$/,''),selIdx=all.findIndex(x=>stationNameKey(x)===stationNameKey(sel)),start=0;
    const lines=all.slice(start,selIdx>=0?selIdx+1:all.length).map(name=>{
      const x=map[name];
      if(x)return `${name}|${offsetToText(x.arrivalBefore)}|${offsetToText(x.departureBefore)}`;
      if(name===sel)return `${name}|${offsetToText(defaultArrivalBefore())}|00:00`;
      return `${name}||`;
    }).join('\n');
    body.insertAdjacentHTML('beforeend',`<div class="card"><h2>発車時刻から逆算する駅別時刻</h2><div class="hint">各時刻は、表示駅の発車時刻から何分何秒前かを設定します。例：<b>${esc(sel)}|00:50|00:00</b> は「${esc(sel)}に発車50秒前に到着、発車時刻に発車」です。前駅は「前駅|03:10|02:40」のように設定できます。</div><div class="field"><label>駅名|到着（何分:何秒前）|発車（何分:何秒前）</label><textarea id="stationTimingText" placeholder="${esc(sel)}|00:50|00:00">${esc(lines)}</textarea></div><div class="field"><label>「まもなく電車がまいります／まもなく到着」を出す時間（到着の何秒前から）</label><input id="arrivalLeadSec" type="number" min="21" step="1" value="${Math.max(21,Number(draft.settings.arrivalSec)||105)}"></div><div class="timingHelp">表示は発車時刻ではなく、この駅の到着時刻を基準にします。到着20秒前で接近表示を終了し、その後は発車まで停車駅案内を流します。未入力の駅は従来の「何分で1駅」の設定から自動推定します。</div></div>`);
  };

  const oldPullTab=pullTab;
  pullTab=function(){
    if(draft&&tab==='stops'&&$('stationTimingText')){
      const r=route(draft),text=$('stationTimingText').value,map={};
      String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
        const a=line.split('|'),name=(a[0]||'').trim(),arr=textToOffset(a[1]),dep=textToOffset(a[2]);
        if(name&&arr!==null&&dep!==null)map[name]={arrivalBefore:arr,departureBefore:dep};
      });
      r.stationTiming=map;
      if($('arrivalLeadSec'))draft.settings.arrivalSec=Math.max(21,Number($('arrivalLeadSec').value)||105);
    }
    return oldPullTab();
  };

  /* Existing refresh predates arrival-time phases. This tiny boundary watcher only
     redraws when the phase/current approach station changes, avoiding 1-second flicker. */
  let lastTimingUiKey='';
  setInterval(()=>{
    const r=route();if(!r)return;
    const u=upcoming(r);
    let key=data.mode+'|'+data.selected.station+'|'+data.selected.route+'|'+data.selected.platform;
    if(data.mode==='platform'){
      const f=u.filter(t=>String(t.platform)===String(data.selected.platform))[0];
      const p=f?selectedStationApproachState(f):null;
      key+='|'+(f?f.time:'-')+'|'+platformPhase(f)+'|'+(p&&p.visible?(p.state+'~'+p.currentIdx+'~'+Math.floor((p.progress||0)*20)):'-');
    }else{
      key+='|'+u.slice(0,6).map(t=>t.time+'~'+status(t)).join(',');
    }
    if(key!==lastTimingUiKey){lastTimingUiKey=key;lastRenderKey='';render()}
  },500);
})();
</script>
<style id="v29BetweenStationPositionStyle">

   between that station and the selected station/next station. */

  left:12px!important;right:12px!important;top:8px!important;bottom:7px!important;

<script id="v29BetweenStationPositionLogic">
(function(){
  'use strict';
  if(typeof timingForStation!=='function' || typeof trainDepartureMs!=='function') return;

  /* The position now follows each station's arrival/departure times:
     - arrival -> departure: on that station
     - previous-station departure -> next-station arrival: between those stations
     This also deliberately uses half-integer currentIdx values while between stations,
     so the existing low-flicker watcher notices the transition without changing it. */
  selectedStationApproachState=function(t){
    const r=route(),all=Array.isArray(r?.stops)?r.stops:[];
    const selected=selectedStationName(r);
    const sel=all.findIndex(x=>stationNameKey(x)===stationNameKey(selected));
    if(sel<0||!all.length)return null;

    const depMs=trainDepartureMs(t),now=Date.now(),start=Math.max(0,sel-3);
    const self=timingForStation(r,all[sel]);
    const selectedArrivalMs=depMs-self.arrivalBefore*1000;
    if(now>=selectedArrivalMs){
      return {all,selectedIdx:sel,currentIdx:sel,visible:true,atSelected:true,betweenAfter:null};
    }

    for(let i=start;i<sel;i++){
      const tm=timingForStation(r,all[i]);
      const arr=depMs-tm.arrivalBefore*1000;
      const leave=depMs-tm.departureBefore*1000;
      const nextTm=timingForStation(r,all[i+1]);
      const nextArr=depMs-nextTm.arrivalBefore*1000;

      if(now>=arr && now<leave){
        return {all,selectedIdx:sel,currentIdx:i,visible:true,atSelected:false,betweenAfter:null};
      }
      if(now>=leave && now<nextArr){
        return {all,selectedIdx:sel,currentIdx:i+0.5,visible:true,atSelected:false,betweenAfter:i};
      }
    }

    const first=timingForStation(r,all[start]);
    const firstArr=depMs-first.arrivalBefore*1000;
    if(now<firstArr)return {all,selectedIdx:sel,currentIdx:start,visible:false,atSelected:false,betweenAfter:null};
    return {all,selectedIdx:sel,currentIdx:start,visible:true,atSelected:false,betweenAfter:null};
  };

  approachPositionHtml=function(t){
    const p=selectedStationApproachState(t);
    if(!p||!p.visible)return `<div class="positionApproach"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram"><span style="color:#9aa4ad">接近前</span></div></div>`;

    const start=Math.max(0,p.selectedIdx-3),view=p.all.slice(start,p.selectedIdx+1),n=Math.max(1,view.length);
    const isBetween=Number.isFinite(p.betweenAfter);
    const stationIdx=Number.isInteger(p.currentIdx)?p.currentIdx:-1;
    let between='';
    if(isBetween){
      const rel=p.betweenAfter-start;
      if(rel>=0 && rel<n-1){
        between=`<div class="approachBetweenLayer" style="--approach-count:${n}"><span class="approachBetweenMarker" style="grid-column:${rel+1} / span 2"></span></div>`;
      }
    }

    return `<div class="positionApproach" style="--line:${esc(route().lineColor||'#2680d9')}"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram">${view.map((name,j)=>{const real=start+j;return `<span class="approachStop ${real===stationIdx?'current':''}"><span class="approachStopName">${esc(name)}</span></span>`}).join('')}${between}</div></div>`;
  };

  /* Force one clean refresh so the new renderer is used immediately. */
  try{ if(typeof lastRenderKey!=='undefined')lastRenderKey=''; render(); }catch(e){}
})();
</script>

<script id="v32PositionFixLogic">
(function(){
  'use strict';
  function canon(v){
    return String(v??'').trim()
      .replace(/[（(［\[].*?[）)］\]]/g,'')
      .replace(/[\s　]+/g,'')
      .replace(/駅$/,'');
  }
  function departureMs(t){
    if(Number.isFinite(Number(t?._dep))) return Number(t._dep);
    const now=new Date(), raw=String(t?.time||'').trim();
    let hh=now.getHours(), mm=NaN;
    if(raw.includes(':')){const a=raw.split(':').map(Number);hh=a[0];mm=a[1];}
    else mm=Number(raw);
    if(!Number.isFinite(hh)||!Number.isFinite(mm)) return now.getTime()+86400000;
    const d=new Date(now); d.setHours(hh,mm,0,0);
    if(d.getTime()<now.getTime()-43200000)d.setDate(d.getDate()+1);
    if(d.getTime()>now.getTime()+43200000)d.setDate(d.getDate()-1);
    return d.getTime();
  }
  function timingFor(r,name,idx,sel){
    const map=(r&&r.stationTiming&&typeof r.stationTiming==='object'&&!Array.isArray(r.stationTiming))?r.stationTiming:{};
    const mk=Object.keys(map).find(k=>canon(k)===canon(name));
    const x=mk?map[mk]:null;
    if(x && Number.isFinite(Number(x.arrivalBefore)) && Number.isFinite(Number(x.departureBefore))){
      return {arrivalBefore:Math.max(0,Number(x.arrivalBefore)),departureBefore:Math.max(0,Number(x.departureBefore))};
    }
    /* Legacy fallback only for stations without an explicit timing row. */
    const stopped=Math.max(1,Number(data?.settings?.stoppedSec)||50);
    const secPer=Math.max(20,(Number(data?.settings?.currentMinutes)||3)*60);
    const dwell=Math.min(30,Math.max(10,secPer*.12));
    if(idx===sel)return {arrivalBefore:stopped,departureBefore:0};
    const depBefore=stopped+(sel-idx)*secPer;
    return {arrivalBefore:depBefore+dwell,departureBefore:depBefore};
  }

  window.selectedStationApproachState=function(t){
    const r=route(), all=Array.isArray(r?.stops)?r.stops:[];
    const selectedRaw=data?.selected?.station||'';
    const sel=all.findIndex(x=>canon(x)===canon(selectedRaw));
    if(sel<0||!all.length)return null;

    const start=Math.max(0,sel-3), dep=departureMs(t), now=Date.now();
    const ev=[];
    for(let i=start;i<=sel;i++){
      const tm=timingFor(r,all[i],i,sel);
      let arr=dep-tm.arrivalBefore*1000;
      let leave=dep-tm.departureBefore*1000;
      /* With offsets expressed as “seconds before selected-station departure”,
         a station's arrival must occur no later than its departure. */
      if(leave<arr) leave=arr;
      ev.push({idx:i,arr,leave});
    }

    if(now<ev[0].arr){
      return {all,selectedIdx:sel,currentIdx:start,visible:false,state:'before',betweenAfter:null,progress:0};
    }
    for(let k=0;k<ev.length;k++){
      const e=ev[k];
      if(now>=e.arr && now<e.leave){
        return {all,selectedIdx:sel,currentIdx:e.idx,visible:true,state:'station',betweenAfter:null,progress:0};
      }
      if(k<ev.length-1){
        const nx=ev[k+1];
        if(now>=e.leave && now<nx.arr){
          const span=Math.max(1,nx.arr-e.leave);
          const progress=Math.max(0,Math.min(1,(now-e.leave)/span));
          return {all,selectedIdx:sel,currentIdx:e.idx+progress,visible:true,state:'between',betweenAfter:e.idx,progress};
        }
      }
    }
    return {all,selectedIdx:sel,currentIdx:sel,visible:true,state:'selected',betweenAfter:null,progress:1};
  };

  window.approachPositionHtml=function(t){
    const p=window.selectedStationApproachState(t);
    if(!p||!p.visible){
      return `<div class="positionApproach"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram"><span style="color:#9aa4ad">接近前</span></div></div>`;
    }
    const start=Math.max(0,p.selectedIdx-3), view=p.all.slice(start,p.selectedIdx+1), n=Math.max(1,view.length);
    const stationIdx=Number.isInteger(p.currentIdx)?p.currentIdx:-1;
    let moving='';
    if(p.state==='between' && Number.isInteger(p.betweenAfter) && n>1){
      const rel=p.betweenAfter-start;
      if(rel>=0&&rel<n-1){
        const pct=((rel+Math.max(0,Math.min(1,Number(p.progress)||0)))/(n-1))*100;
        moving=`<div class="approachBetweenLayerV32"><span class="approachBetweenMarkerV32" style="left:${pct.toFixed(3)}%"></span></div>`;
      }
    }
    return `<div class="positionApproach" style="--line:${esc(route().lineColor||'#2680d9')}"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram">${view.map((name,j)=>{const real=start+j;return `<span class="approachStop ${real===stationIdx?'current':''}"><span class="approachStopName">${esc(name)}</span></span>`}).join('')}${moving}</div></div>`;
  };

  /* Existing render logic only needs a new key when the logical position changes.
     A 5% travel bucket also lets the marker move across the line without redrawing
     the entire board every frame. */
  let last='';
  setInterval(function(){
    try{
      if(data.mode!=='platform')return;
      const r=route(); if(!r)return;
      const f=upcoming(r).filter(t=>String(t.platform)===String(data.selected.platform))[0];
      const p=f?window.selectedStationApproachState(f):null;
      const bucket=p&&p.state==='between'?Math.floor((Number(p.progress)||0)*20):-1;
      const k=f?[f.time,p?.state,p?.currentIdx,p?.betweenAfter,bucket].join('|'):'-';
      if(k!==last){
        last=k;
        try{lastRenderKey='';}catch(_e){}
        render();
      }
    }catch(_e){}
  },250);

  try{lastRenderKey='';render();}catch(_e){}
})();
</script>

<script id="v33DiscretePositionLogic">
(function(){
  function canon(v){
    return String(v??'').trim()
      .replace(/[（(［\[].*?[）)］\]]/g,'')
      .replace(/[\s　]+/g,'')
      .replace(/駅$/,'');
  }
  function depMs(t){
    if(Number.isFinite(Number(t?._dep))) return Number(t._dep);
    const now=new Date(),raw=String(t?.time||'').trim();
    let hh=now.getHours(),mm=NaN;
    if(raw.includes(':')){const a=raw.split(':').map(Number);hh=a[0];mm=a[1];}
    else mm=Number(raw);
    if(!Number.isFinite(hh)||!Number.isFinite(mm)) return now.getTime()+86400000;
    const d=new Date(now);d.setHours(hh,mm,0,0);
    if(d.getTime()<now.getTime()-43200000)d.setDate(d.getDate()+1);
    if(d.getTime()>now.getTime()+43200000)d.setDate(d.getDate()-1);
    return d.getTime();
  }
  function timing(r,name,idx,sel){
    const map=(r&&r.stationTiming&&typeof r.stationTiming==='object'&&!Array.isArray(r.stationTiming))?r.stationTiming:{};
    const key=Object.keys(map).find(k=>canon(k)===canon(name));
    const x=key?map[key]:null;
    if(x&&Number.isFinite(Number(x.arrivalBefore))&&Number.isFinite(Number(x.departureBefore))){
      return {arrivalBefore:Math.max(0,Number(x.arrivalBefore)),departureBefore:Math.max(0,Number(x.departureBefore))};
    }
    const stopped=Math.max(1,Number(data?.settings?.stoppedSec)||50);
    const secPer=Math.max(20,(Number(data?.settings?.currentMinutes)||3)*60);
    const dwell=Math.min(30,Math.max(10,secPer*.12));
    if(idx===sel)return {arrivalBefore:stopped,departureBefore:0};
    const departureBefore=stopped+(sel-idx)*secPer;
    return {arrivalBefore:departureBefore+dwell,departureBefore};
  }

  /* Discrete current-position state.
     1) previous station: from its arrival until its departure
     2) between: from previous-station departure until selected-station arrival
     3) selected station: represented internally, but hidden while the train is
        stopped at the selected station as requested. */
  selectedStationApproachState=function(t){
    const r=route(),all=Array.isArray(r?.stops)?r.stops:[];
    const selectedRaw=data?.selected?.station||'';
    const sel=all.findIndex(x=>canon(x)===canon(selectedRaw));
    if(sel<0||!all.length)return null;

    const dep=depMs(t),now=Date.now();
    const self=timing(r,all[sel],sel,sel);
    const selfArr=dep-self.arrivalBefore*1000;
    const selfLeave=dep-self.departureBefore*1000;

    /* Once the train has arrived at the selected station, it is stopped there.
       Do not show the current-position panel during this dwell. */
    if(now>=selfArr && now<selfLeave){
      return {all,selectedIdx:sel,currentIdx:sel,visible:false,state:'stopped',betweenAfter:null};
    }
    if(now>=selfLeave){
      return {all,selectedIdx:sel,currentIdx:sel,visible:false,state:'departed',betweenAfter:null};
    }

    const prev=sel-1;
    if(prev<0)return {all,selectedIdx:sel,currentIdx:sel,visible:false,state:'before',betweenAfter:null};
    const pt=timing(r,all[prev],prev,sel);
    let prevArr=dep-pt.arrivalBefore*1000;
    let prevLeave=dep-pt.departureBefore*1000;
    if(prevLeave<prevArr)prevLeave=prevArr;

    if(now<prevArr){
      return {all,selectedIdx:sel,currentIdx:prev,visible:false,state:'before',betweenAfter:null};
    }
    if(now<prevLeave){
      return {all,selectedIdx:sel,currentIdx:prev,visible:true,state:'previous',betweenAfter:null};
    }
    if(now<selfArr){
      return {all,selectedIdx:sel,currentIdx:prev+.5,visible:true,state:'between',betweenAfter:prev};
    }
    return {all,selectedIdx:sel,currentIdx:sel,visible:false,state:'stopped',betweenAfter:null};
  };

  approachPositionHtml=function(t){
    const p=selectedStationApproachState(t);
    if(!p||!p.visible){
      return `<div class="positionApproach"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram"><span style="color:#9aa4ad">接近前</span></div></div>`;
    }

    /* For this display we only need the previous station and the selected station.
       This makes the three states visually unambiguous. */
    const sel=p.selectedIdx,prev=Math.max(0,sel-1);
    const view=p.all.slice(prev,sel+1);
    const stationIdx=Number.isInteger(p.currentIdx)?p.currentIdx:-1;
    const between=p.state==='between'
      ? `<div class="approachBetweenPairV33"><span class="approachBetweenMarkerV33"></span></div>`
      : '';
    return `<div class="positionApproach" style="--line:${esc(route().lineColor||'#2680d9')}"><div class="positionApproachLabel">現在の走行位置</div><div class="approachDiagram">${view.map((name,j)=>{const real=prev+j;return `<span class="approachStop ${real===stationIdx?'current':''}"><span class="approachStopName">${esc(name)}</span></span>`}).join('')}${between}</div></div>`;
  };

  /* Redraw only when one of the discrete states changes.  No progress bucket is
     used, so the marker stays fixed in the middle while the train is between stations. */
  let v33Last='';
  setInterval(function(){
    try{
      if(data.mode!=='platform')return;
      const r=route();if(!r)return;
      const f=upcoming(r).filter(t=>String(t.platform)===String(data.selected.platform))[0];
      const p=f?selectedStationApproachState(f):null;
      const key=f?[f.time,p?.state,p?.currentIdx,p?.visible].join('|'):'-';
      if(key!==v33Last){
        v33Last=key;
        try{lastRenderKey='';}catch(_e){}
        render();
      }
    }catch(_e){}
  },250);

  try{lastRenderKey='';render();}catch(_e){}
})();
</script>
