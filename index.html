<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>架空鉄道 発車標</title>
<style>
:root{--bg:#050607;--panel:#101316;--line:#31363b;--text:#f5f7fa;--muted:#aab2ba;--accent:#19c37d;--warn:#ffd43b}
*{box-sizing:border-box}body{margin:0;background:#1b1f23;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:12px}.board{background:var(--bg);border:4px solid #40464c;border-radius:12px;overflow:hidden;box-shadow:0 12px 32px #0007}.top{display:flex;justify-content:space-between;align-items:end;padding:12px 14px 8px;border-bottom:1px solid var(--line)}.station{font-weight:800;font-size:clamp(20px,5vw,34px)}.clock{font-variant-numeric:tabular-nums;font-size:clamp(18px,4vw,28px);color:#e8edf2}.header,.row{display:grid;grid-template-columns:1.1fr 1fr 2.4fr .8fr;align-items:center}.header{padding:8px 10px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.row{min-height:74px;padding:8px 10px;border-bottom:1px solid #252a2e}.time{font-size:clamp(25px,7vw,42px);font-weight:700;font-variant-numeric:tabular-nums}.type{display:inline-block;padding:5px 7px;border-radius:5px;background:#136f48;text-align:center;font-weight:800;font-size:clamp(13px,3.4vw,18px)}.dest{font-size:clamp(22px,6vw,36px);font-weight:800;line-height:1.05}.dest small{display:block;color:#bfc6cd;font-size:.45em;margin-top:5px;font-weight:600}.track{text-align:center;font-size:clamp(27px,7vw,42px);font-weight:800;color:var(--warn)}.ticker{white-space:nowrap;overflow:hidden;padding:10px 0;color:#ffd43b;font-size:15px}.ticker span{display:inline-block;padding-left:100%;animation:marquee 18s linear infinite}@keyframes marquee{to{transform:translateX(-100%)}}.controls{margin-top:12px;background:#fff;color:#17202a;border-radius:12px;padding:14px}.controls h2{font-size:18px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:8px}.field label{font-size:12px;color:#58616a;display:block;margin-bottom:3px}input,select{width:100%;font:inherit;padding:10px;border:1px solid #cbd1d6;border-radius:8px;background:#fff}.trainEdit{border-top:1px solid #e2e6e9;padding-top:10px;margin-top:10px}button{border:0;border-radius:9px;padding:11px 13px;font-weight:800;background:#1677ff;color:#fff;margin-right:6px;margin-top:6px}.secondary{background:#e9eef5;color:#1d2a35}.hint{font-size:12px;color:#69737d;margin-top:10px}@media(max-width:560px){.wrap{padding:0}.board{border-width:0;border-radius:0}.header,.row{grid-template-columns:1.05fr 1.05fr 2.1fr .65fr}.row{min-height:68px}.controls{border-radius:0}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<section class="board">
<div class="top"><div><div style="font-size:12px;color:#9da6ae">架空鉄道</div><div class="station" id="stationView">中央駅</div></div><div class="clock" id="clock">--:--:--</div></div>
<div class="header"><div>時刻<br>Time</div><div>種別<br>Type</div><div>行先 / Destination</div><div style="text-align:center">番線</div></div>
<div id="rows"></div><div class="ticker"><span id="tickerView">ご乗車ありがとうございます。黄色い線の内側でお待ちください。　Thank you for traveling with us.</span></div>
</section>
<section class="controls"><h2>発車標を編集</h2><div class="field"><label>駅名</label><input id="stationInput" value="中央駅"></div><div id="editors"></div><div class="field"><label>案内テロップ</label><input id="tickerInput" value="ご乗車ありがとうございます。黄色い線の内側でお待ちください。　Thank you for traveling with us."></div><button id="apply">表示を更新</button><button class="secondary" id="toggleLang">日本語 / English 切替</button><button class="secondary" id="full">全画面</button><div class="hint">入力内容はこの端末に保存されます。Safariで開いて「ホーム画面に追加」すると発車標っぽく使えます。</div></section>
</div>
<script>
const defaults=[
 {time:'23:42',type:'快速',typeEn:'Rapid',dest:'海浜中央',destEn:'Kaihin-Chuo',track:'3'},
 {time:'23:51',type:'各駅停車',typeEn:'Local',dest:'新都心',destEn:'Shintoshin',track:'3'},
 {time:'00:03',type:'特急',typeEn:'Limited Exp.',dest:'空港第2ターミナル',destEn:'Airport Terminal 2',track:'4'}];
let data=JSON.parse(localStorage.getItem('fictionRailBoard')||'null')||{station:'中央駅',ticker:'ご乗車ありがとうございます。黄色い線の内側でお待ちください。　Thank you for traveling with us.',trains:defaults};let en=false;
const editors=document.getElementById('editors');
function makeEditors(){editors.innerHTML='';data.trains.forEach((t,i)=>{editors.insertAdjacentHTML('beforeend',`<div class="trainEdit"><b>${i+1}本目</b><div class="grid"><div class="field"><label>時刻</label><input data-i="${i}" data-k="time" value="${t.time}"></div><div class="field"><label>番線</label><input data-i="${i}" data-k="track" value="${t.track}"></div><div class="field"><label>種別</label><input data-i="${i}" data-k="type" value="${t.type}"></div><div class="field"><label>Type</label><input data-i="${i}" data-k="typeEn" value="${t.typeEn}"></div><div class="field"><label>行先</label><input data-i="${i}" data-k="dest" value="${t.dest}"></div><div class="field"><label>Destination</label><input data-i="${i}" data-k="destEn" value="${t.destEn}"></div></div></div>`)});document.getElementById('stationInput').value=data.station;document.getElementById('tickerInput').value=data.ticker}
function render(){document.getElementById('stationView').textContent=data.station;document.getElementById('tickerView').textContent=data.ticker;document.getElementById('rows').innerHTML=data.trains.map(t=>`<div class="row"><div class="time">${t.time}</div><div><span class="type">${en?t.typeEn:t.type}</span></div><div class="dest">${en?t.destEn:t.dest}<small>${en?t.dest:t.destEn}</small></div><div class="track">${t.track}</div></div>`).join('')}
document.getElementById('apply').onclick=()=>{data.station=document.getElementById('stationInput').value;data.ticker=document.getElementById('tickerInput').value;document.querySelectorAll('[data-i]').forEach(x=>data.trains[+x.dataset.i][x.dataset.k]=x.value);localStorage.setItem('fictionRailBoard',JSON.stringify(data));render()};document.getElementById('toggleLang').onclick=()=>{en=!en;render()};document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour12:false})},500);makeEditors();render();
</script></body></html>
